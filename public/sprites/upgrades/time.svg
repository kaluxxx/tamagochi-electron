<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Time Bonus Upgrade - Horloge/Sablier -->

  <!-- Ombre au sol -->
  <rect x="10" y="28" width="12" height="1" fill="#D0D0D0" opacity="0.6"/>

  <!-- Cadre horloge (contour) -->
  <rect x="11" y="4" width="10" height="2" fill="#2C3E50"/>
  <rect x="9" y="6" width="14" height="2" fill="#2C3E50"/>
  <rect x="8" y="8" width="16" height="2" fill="#2C3E50"/>
  <rect x="7" y="10" width="18" height="2" fill="#2C3E50"/>
  <rect x="7" y="12" width="18" height="2" fill="#2C3E50"/>
  <rect x="7" y="14" width="18" height="2" fill="#2C3E50"/>
  <rect x="7" y="16" width="18" height="2" fill="#2C3E50"/>
  <rect x="8" y="18" width="16" height="2" fill="#2C3E50"/>
  <rect x="9" y="20" width="14" height="2" fill="#2C3E50"/>
  <rect x="11" y="22" width="10" height="2" fill="#2C3E50"/>

  <!-- Face horloge (blanc) -->
  <rect x="12" y="6" width="8" height="2" fill="#ECF0F1"/>
  <rect x="10" y="8" width="12" height="2" fill="#ECF0F1"/>
  <rect x="9" y="10" width="14" height="8" fill="#ECF0F1"/>
  <rect x="10" y="18" width="12" height="2" fill="#ECF0F1"/>
  <rect x="12" y="20" width="8" height="2" fill="#ECF0F1"/>

  <!-- Chiffres (12, 3, 6, 9) -->
  <rect x="15" y="7" width="2" height="1" fill="#2C3E50"/>
  <rect x="21" y="13" width="1" height="2" fill="#2C3E50"/>
  <rect x="15" y="19" width="2" height="1" fill="#2C3E50"/>
  <rect x="10" y="13" width="1" height="2" fill="#2C3E50"/>

  <!-- Centre horloge -->
  <rect x="15" y="13" width="2" height="2" fill="#E74C3C"/>

  <!-- Aiguille des heures (vers 10h) -->
  <rect x="14" y="12" width="1" height="2" fill="#2C3E50"/>
  <rect x="13" y="11" width="1" height="2" fill="#2C3E50"/>
  <rect x="12" y="10" width="1" height="2" fill="#2C3E50"/>

  <!-- Aiguille des minutes (vers 2h) -->
  <rect x="16" y="11" width="1" height="2" fill="#E74C3C"/>
  <rect x="17" y="10" width="1" height="2" fill="#E74C3C"/>
  <rect x="18" y="9" width="1" height="2" fill="#E74C3C"/>
  <rect x="19" y="8" width="1" height="1" fill="#E74C3C"/>

  <!-- Reflet -->
  <rect x="11" y="8" width="3" height="1" fill="#FFFFFF"/>
  <rect x="10" y="10" width="2" height="2" fill="#FFFFFF" opacity="0.5"/>

  <!-- +5s symbole en bas -->
  <rect x="12" y="24" width="1" height="3" fill="#27AE60"/>
  <rect x="11" y="25" width="3" height="1" fill="#27AE60"/>
  <rect x="15" y="24" width="2" height="1" fill="#27AE60"/>
  <rect x="15" y="25" width="1" height="1" fill="#27AE60"/>
  <rect x="15" y="26" width="2" height="1" fill="#27AE60"/>
  <rect x="16" y="25" width="1" height="1" fill="#27AE60"/>
  <rect x="18" y="24" width="2" height="1" fill="#27AE60"/>
  <rect x="19" y="25" width="1" height="1" fill="#27AE60"/>
  <rect x="18" y="26" width="2" height="1" fill="#27AE60"/>
</svg>
