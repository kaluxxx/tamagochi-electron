<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Alien Happy - Joyeux avec antennes qui bougent -->

  <!-- Antennes gauche -->
  <rect x="11" y="6" width="1" height="3" fill="#2ECC71"/>
  <rect x="10" y="6" width="1" height="2" fill="#27AE60"/>
  <rect x="9" y="5" width="2" height="1" fill="#2ECC71"/>
  <rect x="9" y="4" width="2" height="1" fill="#52D981"/>
  <!-- Boule antenne gauche -->
  <rect x="9" y="3" width="2" height="2" fill="#9B59B6"/>
  <rect x="9" y="3" width="1" height="1" fill="#C89EDB"/>

  <!-- Antennes droite -->
  <rect x="20" y="6" width="1" height="3" fill="#2ECC71"/>
  <rect x="21" y="6" width="1" height="2" fill="#27AE60"/>
  <rect x="21" y="5" width="2" height="1" fill="#2ECC71"/>
  <rect x="21" y="4" width="2" height="1" fill="#52D981"/>
  <!-- Boule antenne droite -->
  <rect x="21" y="3" width="2" height="2" fill="#9B59B6"/>
  <rect x="22" y="3" width="1" height="1" fill="#C89EDB"/>

  <!-- Contour tête -->
  <rect x="10" y="9" width="12" height="2" fill="#27AE60"/>
  <rect x="9" y="11" width="14" height="12" fill="#27AE60"/>

  <!-- Tête principale -->
  <rect x="11" y="10" width="10" height="13" fill="#2ECC71"/>
  <rect x="12" y="11" width="8" height="11" fill="#52D981"/>

  <!-- Grand front alien -->
  <rect x="13" y="12" width="6" height="4" fill="#7FE5A0"/>

  <!-- Grands yeux aliens (contents) -->
  <rect x="12" y="15" width="3" height="4" fill="#1C1C1C"/>
  <rect x="13" y="16" width="1" height="2" fill="#4A90E2"/>
  <rect x="14" y="17" width="1" height="1" fill="#FFFFFF"/>

  <rect x="17" y="15" width="3" height="4" fill="#1C1C1C"/>
  <rect x="18" y="16" width="1" height="2" fill="#4A90E2"/>
  <rect x="19" y="17" width="1" height="1" fill="#FFFFFF"/>

  <!-- Petit nez alien -->
  <rect x="16" y="19" width="1" height="1" fill="#27AE60"/>

  <!-- Grande bouche souriante -->
  <rect x="14" y="20" width="4" height="2" fill="#1C1C1C"/>
  <rect x="15" y="21" width="2" height="1" fill="#34495E"/>

  <!-- Petit corps rond -->
  <rect x="12" y="23" width="8" height="5" fill="#2ECC71"/>
  <rect x="13" y="24" width="6" height="3" fill="#52D981"/>
  <rect x="14" y="25" width="4" height="1" fill="#7FE5A0"/>

  <!-- Petites pattes/pieds -->
  <rect x="12" y="27" width="2" height="1" fill="#27AE60"/>
  <rect x="18" y="27" width="2" height="1" fill="#27AE60"/>

  <!-- Étoiles de joie -->
  <rect x="5" y="14" width="1" height="1" fill="#FFD700"/>
  <rect x="4" y="15" width="1" height="1" fill="#FFD700"/>
  <rect x="6" y="15" width="1" height="1" fill="#FFD700"/>
  <rect x="5" y="16" width="1" height="1" fill="#FFD700"/>

  <rect x="26" y="14" width="1" height="1" fill="#FFD700"/>
  <rect x="25" y="15" width="1" height="1" fill="#FFD700"/>
  <rect x="27" y="15" width="1" height="1" fill="#FFD700"/>
  <rect x="26" y="16" width="1" height="1" fill="#FFD700"/>

  <!-- Petit symbole alien (trois lignes) -->
  <rect x="15" y="13" width="2" height="1" fill="#27AE60"/>
</svg>
