<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Alien Hungry - Affamé avec bouche grande ouverte -->

  <!-- Antennes agitées -->
  <rect x="11" y="6" width="1" height="3" fill="#2ECC71"/>
  <rect x="10" y="7" width="1" height="2" fill="#27AE60"/>
  <rect x="9" y="6" width="2" height="1" fill="#2ECC71"/>
  <rect x="8" y="5" width="2" height="1" fill="#52D981"/>
  <!-- Boule antenne -->
  <rect x="8" y="4" width="2" height="2" fill="#9B59B6"/>
  <rect x="8" y="4" width="1" height="1" fill="#C89EDB"/>

  <rect x="20" y="6" width="1" height="3" fill="#2ECC71"/>
  <rect x="21" y="7" width="1" height="2" fill="#27AE60"/>
  <rect x="21" y="6" width="2" height="1" fill="#2ECC71"/>
  <rect x="22" y="5" width="2" height="1" fill="#52D981"/>
  <!-- Boule antenne -->
  <rect x="22" y="4" width="2" height="2" fill="#9B59B6"/>
  <rect x="23" y="4" width="1" height="1" fill="#C89EDB"/>

  <!-- Contour tête -->
  <rect x="10" y="9" width="12" height="2" fill="#27AE60"/>
  <rect x="9" y="11" width="14" height="13" fill="#27AE60"/>

  <!-- Tête principale -->
  <rect x="11" y="10" width="10" height="14" fill="#2ECC71"/>
  <rect x="12" y="11" width="8" height="12" fill="#52D981"/>

  <!-- Front alien -->
  <rect x="13" y="12" width="6" height="3" fill="#7FE5A0"/>

  <!-- Yeux affamés (grands et suppliant) -->
  <rect x="12" y="15" width="3" height="5" fill="#1C1C1C"/>
  <rect x="13" y="16" width="1" height="3" fill="#4A90E2"/>
  <rect x="14" y="17" width="1" height="1" fill="#FFFFFF"/>

  <rect x="17" y="15" width="3" height="5" fill="#1C1C1C"/>
  <rect x="18" y="16" width="1" height="3" fill="#4A90E2"/>
  <rect x="19" y="17" width="1" height="1" fill="#FFFFFF"/>

  <!-- Bouche TRÈS grande ouverte (affamé) -->
  <rect x="14" y="20" width="4" height="4" fill="#1C1C1C"/>
  <rect x="13" y="21" width="6" height="2" fill="#2C3E50"/>
  <rect x="15" y="22" width="2" height="1" fill="#34495E"/>

  <!-- Langue alien (verte) -->
  <rect x="15" y="23" width="2" height="1" fill="#52D981"/>

  <!-- Bave/salive -->
  <rect x="18" y="22" width="1" height="1" fill="#6CB4E8"/>
  <rect x="18" y="23" width="1" height="2" fill="#6CB4E8"/>
  <rect x="17" y="24" width="1" height="1" fill="#4A90E2"/>

  <!-- Corps avec ventre creux -->
  <rect x="11" y="24" width="10" height="4" fill="#2ECC71"/>
  <rect x="12" y="25" width="8" height="2" fill="#52D981"/>

  <!-- Lignes ventre affamé -->
  <rect x="14" y="25" width="4" height="1" fill="#27AE60"/>
  <rect x="13" y="26" width="6" height="1" fill="#27AE60"/>

  <!-- Pieds -->
  <rect x="12" y="27" width="2" height="1" fill="#27AE60"/>
  <rect x="18" y="27" width="2" height="1" fill="#27AE60"/>

  <!-- Symbole nourriture (pensée) -->
  <rect x="24" y="13" width="3" height="3" fill="#FFB366"/>
  <rect x="25" y="14" width="1" height="1" fill="#E07020"/>
  <rect x="25" y="12" width="1" height="1" fill="#FFB366"/>
</svg>
