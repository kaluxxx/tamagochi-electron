<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Alien Tired - Fatigué, antennes tombantes, yeux mi-clos -->

  <!-- Antennes tombantes (fatigue) -->
  <rect x="11" y="6" width="1" height="3" fill="#2ECC71"/>
  <rect x="10" y="7" width="1" height="2" fill="#27AE60"/>
  <rect x="9" y="8" width="2" height="2" fill="#2ECC71"/>
  <!-- Boule antenne gauche -->
  <rect x="8" y="8" width="2" height="2" fill="#9B59B6"/>
  <rect x="8" y="8" width="1" height="1" fill="#C89EDB"/>

  <rect x="20" y="6" width="1" height="3" fill="#2ECC71"/>
  <rect x="21" y="7" width="1" height="2" fill="#27AE60"/>
  <rect x="21" y="8" width="2" height="2" fill="#2ECC71"/>
  <!-- Boule antenne droite -->
  <rect x="22" y="8" width="2" height="2" fill="#9B59B6"/>
  <rect x="23" y="8" width="1" height="1" fill="#C89EDB"/>

  <!-- Contour tête -->
  <rect x="10" y="9" width="12" height="2" fill="#27AE60"/>
  <rect x="9" y="11" width="14" height="12" fill="#27AE60"/>

  <!-- Tête principale -->
  <rect x="11" y="10" width="10" height="13" fill="#2ECC71"/>
  <rect x="12" y="11" width="8" height="11" fill="#52D981"/>

  <!-- Grand front alien -->
  <rect x="13" y="12" width="6" height="4" fill="#7FE5A0"/>
  <rect x="14" y="13" width="4" height="2" fill="#A3EEC2"/>

  <!-- Yeux mi-clos (fatigués) -->
  <rect x="12" y="16" width="3" height="4" fill="#52D981"/>
  <rect x="12" y="17" width="3" height="3" fill="#1C1C1C"/>
  <rect x="13" y="18" width="1" height="1" fill="#4A90E2"/>
  <rect x="14" y="18" width="1" height="1" fill="#FFFFFF"/>

  <rect x="17" y="16" width="3" height="4" fill="#52D981"/>
  <rect x="17" y="17" width="3" height="3" fill="#1C1C1C"/>
  <rect x="18" y="18" width="1" height="1" fill="#4A90E2"/>
  <rect x="19" y="18" width="1" height="1" fill="#FFFFFF"/>

  <!-- Paupières fatiguées -->
  <rect x="12" y="16" width="3" height="1" fill="#27AE60"/>
  <rect x="17" y="16" width="3" height="1" fill="#27AE60"/>

  <!-- Petit nez alien -->
  <rect x="16" y="20" width="1" height="1" fill="#27AE60"/>

  <!-- Bouche fatiguée (petite ouverture) -->
  <rect x="15" y="21" width="2" height="1" fill="#1C1C1C"/>

  <!-- Marques aliens sur le front -->
  <rect x="15" y="13" width="2" height="1" fill="#27AE60"/>
  <rect x="14" y="14" width="4" height="1" fill="#52D981"/>

  <!-- Corps affaissé -->
  <rect x="11" y="23" width="10" height="6" fill="#2ECC71"/>
  <rect x="12" y="24" width="8" height="4" fill="#52D981"/>
  <rect x="13" y="25" width="6" height="2" fill="#7FE5A0"/>

  <!-- Petits bras/appendices tombants -->
  <rect x="9" y="26" width="2" height="2" fill="#2ECC71"/>
  <rect x="21" y="26" width="2" height="2" fill="#2ECC71"/>

  <!-- Pieds -->
  <rect x="13" y="28" width="2" height="1" fill="#27AE60"/>
  <rect x="17" y="28" width="2" height="1" fill="#27AE60"/>

  <!-- Détail ventre -->
  <rect x="14" y="26" width="4" height="1" fill="#A3EEC2"/>
</svg>
