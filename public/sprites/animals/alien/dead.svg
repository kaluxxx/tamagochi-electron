  <rect x="10" y="9" width="12" height="2" fill="#95A5A6"/>
  <rect x="9" y="11" width="14" height="12" fill="#95A5A6"/>

  <!-- Tête principale (fantôme verdâtre pâle) -->
  <rect x="11" y="10" width="10" height="13" fill="#BDC3C7"/>
  <rect x="12" y="11" width="8" height="11" fill="#D5F5E3"/>

  <!-- Front alien fantôme -->
  <rect x="13" y="12" width="6" height="3" fill="#E8F8F5"/>

  <!-- Grands yeux X morts (caractéristique alien) -->
  <rect x="11" y="15" width="1" height="1" fill="#2C3E50"/>
  <rect x="13" y="15" width="1" height="1" fill="#2C3E50"/>
  <rect x="12" y="16" width="1" height="1" fill="#2C3E50"/>
  <rect x="11" y="17" width="1" height="1" fill="#2C3E50"/>
  <rect x="13" y="17" width="1" height="1" fill="#2C3E50"/>
  <rect x="12" y="18" width="1" height="1" fill="#2C3E50"/>
  <rect x="11" y="19" width="1" height="1" fill="#2C3E50"/>
  <rect x="13" y="19" width="1" height="1" fill="#2C3E50"/>

  <rect x="18" y="15" width="1" height="1" fill="#2C3E50"/>
  <rect x="20" y="15" width="1" height="1" fill="#2C3E50"/>
  <rect x="19" y="16" width="1" height="1" fill="#2C3E50"/>
  <rect x="18" y="17" width="1" height="1" fill="#2C3E50"/>
  <rect x="20" y="17" width="1" height="1" fill="#2C3E50"/>
  <rect x="19" y="18" width="1" height="1" fill="#2C3E50"/>
  <rect x="18" y="19" width="1" height="1" fill="#2C3E50"/>
  <rect x="20" y="19" width="1" height="1" fill="#2C3E50"/>

  <!-- Petit nez -->
  <rect x="15" y="19" width="2" height="1" fill="#7F8C8D"/>

  <!-- Bouche triste -->
  <rect x="14" y="21" width="1" height="1" fill="#2C3E50"/>
  <rect x="15" y="20" width="2" height="1" fill="#2C3E50"/>
  <rect x="17" y="21" width="1" height="1" fill="#2C3E50"/>

  <!-- Corps fantôme (fondu vers le bas avec teinte verte) -->
  <rect x="12" y="23" width="8" height="2" fill="#BDC3C7" opacity="0.8"/>
  <rect x="13" y="25" width="6" height="2" fill="#A3E4D7" opacity="0.6"/>
  <rect x="14" y="27" width="4" height="2" fill="#7DCEA0" opacity="0.4"/>
  <rect x="15" y="29" width="2" height="2" fill="#58D68D" opacity="0.2"/>

  <!-- Particules d'énergie cosmique -->
  <rect x="6" y="10" width="1" height="1" fill="#9B59B6" opacity="0.8"/>
  <rect x="25" y="12" width="1" height="1" fill="#9B59B6" opacity="0.8"/>
  <rect x="7" y="18" width="1" height="1" fill="#58D68D" opacity="0.6"/>
  <rect x="24" y="16" width="1" height="1" fill="#58D68D" opacity="0.6"/>
  <rect x="5" y="14" width="1" height="1" fill="#FFFFFF" opacity="0.7"/>
