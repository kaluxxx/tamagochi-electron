<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Alien Dead - Décédé en gris avec yeux X -->

  <!-- Antennes tombantes gauche -->
  <rect x="11" y="8" width="1" height="3" fill="#7F8C8D"/>
  <rect x="10" y="9" width="1" height="2" fill="#6C7A89"/>
  <rect x="9" y="10" width="2" height="1" fill="#7F8C8D"/>
  <!-- Boule antenne gauche (basse, grise) -->
  <rect x="8" y="11" width="2" height="2" fill="#95A5A6"/>
  <rect x="8" y="11" width="1" height="1" fill="#7F8C8D"/>

  <!-- Antennes tombantes droite -->
  <rect x="20" y="8" width="1" height="3" fill="#7F8C8D"/>
  <rect x="21" y="9" width="1" height="2" fill="#6C7A89"/>
  <rect x="21" y="10" width="2" height="1" fill="#7F8C8D"/>
  <!-- Boule antenne droite (basse, grise) -->
  <rect x="22" y="11" width="2" height="2" fill="#95A5A6"/>
  <rect x="23" y="11" width="1" height="1" fill="#7F8C8D"/>

  <!-- Contour tête -->
  <rect x="10" y="10" width="12" height="2" fill="#6C7A89"/>
  <rect x="9" y="12" width="14" height="12" fill="#6C7A89"/>

  <!-- Tête principale -->
  <rect x="11" y="11" width="10" height="13" fill="#7F8C8D"/>
  <rect x="12" y="12" width="8" height="11" fill="#95A5A6"/>

  <!-- Front alien -->
  <rect x="13" y="13" width="6" height="4" fill="#B4BCC2"/>

  <!-- Yeux en X (mort) -->
  <!-- Oeil gauche X (plus grand pour alien) -->
  <rect x="12" y="16" width="1" height="1" fill="#2C3E50"/>
  <rect x="13" y="17" width="1" height="1" fill="#2C3E50"/>
  <rect x="14" y="18" width="1" height="1" fill="#2C3E50"/>
  <rect x="13" y="16" width="1" height="1" fill="#2C3E50"/>
  <rect x="14" y="17" width="1" height="1" fill="#2C3E50"/>
  <rect x="12" y="18" width="1" height="1" fill="#2C3E50"/>
  <rect x="13" y="19" width="1" height="1" fill="#2C3E50"/>
  <rect x="14" y="19" width="1" height="1" fill="#2C3E50"/>

  <!-- Oeil droit X (plus grand pour alien) -->
  <rect x="17" y="16" width="1" height="1" fill="#2C3E50"/>
  <rect x="18" y="17" width="1" height="1" fill="#2C3E50"/>
  <rect x="19" y="18" width="1" height="1" fill="#2C3E50"/>
  <rect x="18" y="16" width="1" height="1" fill="#2C3E50"/>
  <rect x="19" y="17" width="1" height="1" fill="#2C3E50"/>
  <rect x="17" y="18" width="1" height="1" fill="#2C3E50"/>
  <rect x="18" y="19" width="1" height="1" fill="#2C3E50"/>
  <rect x="19" y="19" width="1" height="1" fill="#2C3E50"/>

  <!-- Petit nez -->
  <rect x="16" y="20" width="1" height="1" fill="#6C7A89"/>

  <!-- Bouche neutre -->
  <rect x="14" y="22" width="4" height="1" fill="#2C3E50"/>

  <!-- Corps couché -->
  <rect x="12" y="24" width="8" height="4" fill="#7F8C8D"/>
  <rect x="13" y="25" width="6" height="2" fill="#95A5A6"/>

  <!-- Pieds -->
  <rect x="12" y="27" width="2" height="1" fill="#6C7A89"/>
  <rect x="18" y="27" width="2" height="1" fill="#6C7A89"/>

  <!-- Symbole âme alien (cercle lumineux) -->
  <rect x="15" y="7" width="2" height="1" fill="#FFFFFF" opacity="0.6"/>
  <rect x="14" y="8" width="1" height="1" fill="#FFFFFF" opacity="0.6"/>
  <rect x="17" y="8" width="1" height="1" fill="#FFFFFF" opacity="0.6"/>
  <rect x="15" y="9" width="2" height="1" fill="#FFFFFF" opacity="0.4"/>
</svg>
