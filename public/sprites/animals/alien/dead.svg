<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Alien Dead - Style fantôme avec auréole cosmique -->

  <!-- Auréole cosmique (violet/magenta) -->
  <rect x="13" y="3" width="6" height="1" fill="#9B59B6"/>
  <rect x="12" y="4" width="1" height="1" fill="#9B59B6"/>
  <rect x="19" y="4" width="1" height="1" fill="#9B59B6"/>
  <rect x="12" y="5" width="1" height="1" fill="#8E44AD"/>
  <rect x="19" y="5" width="1" height="1" fill="#8E44AD"/>
  <rect x="13" y="6" width="6" height="1" fill="#9B59B6"/>

  <!-- Antennes fantôme tombantes -->
  <rect x="11" y="7" width="1" height="2" fill="#BDC3C7" opacity="0.8"/>
  <rect x="10" y="9" width="2" height="1" fill="#95A5A6" opacity="0.7"/>
  <rect x="9" y="10" width="2" height="2" fill="#BDC3C7" opacity="0.6"/>

  <rect x="20" y="7" width="1" height="2" fill="#BDC3C7" opacity="0.8"/>
