<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Chien Dead - Décédé en gris avec yeux X -->

  <!-- Oreilles tombantes -->
  <rect x="8" y="11" width="3" height="6" fill="#7F8C8D"/>
  <rect x="9" y="12" width="1" height="4" fill="#95A5A6"/>
  <rect x="21" y="11" width="3" height="6" fill="#7F8C8D"/>
  <rect x="22" y="12" width="1" height="4" fill="#95A5A6"/>

  <!-- Ombres oreilles -->
  <rect x="8" y="16" width="2" height="1" fill="#6C7A89"/>
  <rect x="22" y="16" width="2" height="1" fill="#6C7A89"/>

  <!-- Contour tête -->
  <rect x="10" y="12" width="12" height="2" fill="#6C7A89"/>
  <rect x="9" y="14" width="14" height="10" fill="#6C7A89"/>

  <!-- Tête principale -->
  <rect x="11" y="13" width="10" height="11" fill="#7F8C8D"/>

  <!-- Museau clair -->
  <rect x="11" y="17" width="10" height="7" fill="#B4BCC2"/>
  <rect x="12" y="18" width="8" height="5" fill="#CCD6DD"/>

  <!-- Yeux en X (mort) -->
  <!-- Oeil gauche X -->
  <rect x="12" y="16" width="1" height="1" fill="#2C3E50"/>
  <rect x="13" y="17" width="1" height="1" fill="#2C3E50"/>
  <rect x="14" y="16" width="1" height="1" fill="#2C3E50"/>
  <rect x="13" y="16" width="1" height="1" fill="#2C3E50"/>
  <rect x="12" y="18" width="1" height="1" fill="#2C3E50"/>
  <rect x="14" y="18" width="1" height="1" fill="#2C3E50"/>

  <!-- Oeil droit X -->
  <rect x="17" y="16" width="1" height="1" fill="#2C3E50"/>
  <rect x="18" y="17" width="1" height="1" fill="#2C3E50"/>
  <rect x="19" y="16" width="1" height="1" fill="#2C3E50"/>
  <rect x="18" y="16" width="1" height="1" fill="#2C3E50"/>
  <rect x="17" y="18" width="1" height="1" fill="#2C3E50"/>
  <rect x="19" y="18" width="1" height="1" fill="#2C3E50"/>

  <!-- Nez -->
  <rect x="15" y="19" width="2" height="2" fill="#5C6A74"/>
  <rect x="14" y="20" width="4" height="1" fill="#6C7A89"/>

  <!-- Bouche neutre -->
  <rect x="14" y="22" width="4" height="1" fill="#2C3E50"/>

  <!-- Corps couché -->
  <rect x="10" y="24" width="12" height="4" fill="#7F8C8D"/>
  <rect x="11" y="25" width="10" height="2" fill="#95A5A6"/>

  <!-- Pattes -->
  <rect x="11" y="27" width="2" height="1" fill="#7F8C8D"/>
  <rect x="19" y="27" width="2" height="1" fill="#7F8C8D"/>

  <!-- Queue tombante -->
  <rect x="10" y="26" width="2" height="2" fill="#7F8C8D"/>
  <rect x="9" y="27" width="2" height="1" fill="#95A5A6"/>
  <rect x="8" y="27" width="1" height="1" fill="#6C7A89"/>

  <!-- Symbole âme (petit halo) -->
  <rect x="15" y="9" width="2" height="1" fill="#FFFFFF" opacity="0.6"/>
  <rect x="14" y="10" width="1" height="1" fill="#FFFFFF" opacity="0.6"/>
  <rect x="17" y="10" width="1" height="1" fill="#FFFFFF" opacity="0.6"/>
</svg>
