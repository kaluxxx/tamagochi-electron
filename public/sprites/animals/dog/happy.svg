<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Chien Happy - Corgi content avec langue -->

  <!-- Oreilles tombantes -->
  <rect x="8" y="9" width="3" height="6" fill="#8B4513"/>
  <rect x="9" y="10" width="1" height="4" fill="#A0522D"/>
  <rect x="21" y="9" width="3" height="6" fill="#8B4513"/>
  <rect x="22" y="10" width="1" height="4" fill="#A0522D"/>

  <!-- Ombres oreilles -->
  <rect x="8" y="14" width="2" height="1" fill="#6B3410"/>
  <rect x="22" y="14" width="2" height="1" fill="#6B3410"/>

  <!-- Contour tête -->
  <rect x="10" y="11" width="12" height="2" fill="#6B3410"/>
  <rect x="9" y="13" width="14" height="10" fill="#6B3410"/>

  <!-- Tête principale -->
  <rect x="11" y="12" width="10" height="11" fill="#8B4513"/>

  <!-- Museau clair (plus gros que le chat) -->
  <rect x="11" y="16" width="10" height="7" fill="#D2B48C"/>
  <rect x="12" y="17" width="8" height="5" fill="#E8D5B7"/>

  <!-- Yeux joyeux (avec brillance) -->
  <rect x="13" y="14" width="2" height="3" fill="#2C3E50"/>
  <rect x="13" y="14" width="1" height="1" fill="#FFFFFF"/>
  <rect x="14" y="15" width="1" height="1" fill="#7F8C8D"/>

  <rect x="17" y="14" width="2" height="3" fill="#2C3E50"/>
  <rect x="17" y="14" width="1" height="1" fill="#FFFFFF"/>
  <rect x="18" y="15" width="1" height="1" fill="#7F8C8D"/>

  <!-- Nez large et noir -->
  <rect x="15" y="18" width="2" height="2" fill="#1C1C1C"/>
  <rect x="14" y="19" width="4" height="1" fill="#2C3E50"/>
  <rect x="15" y="19" width="1" height="1" fill="#7F8C8D"/>

  <!-- Grande bouche souriante -->
  <rect x="13" y="20" width="6" height="2" fill="#2C3E50"/>
  <rect x="14" y="21" width="4" height="1" fill="#FF6B9D"/>

  <!-- Langue pendante (happy pant) -->
  <rect x="15" y="22" width="2" height="3" fill="#FF6B9D"/>
  <rect x="16" y="23" width="1" height="1" fill="#FF8BB0"/>
  <rect x="15" y="24" width="1" height="1" fill="#E05080"/>

  <!-- Taches sur le museau -->
  <rect x="12" y="18" width="1" height="1" fill="#A0522D"/>
  <rect x="19" y="18" width="1" height="1" fill="#A0522D"/>

  <!-- Corps corgi (court et long) -->
  <rect x="10" y="23" width="12" height="5" fill="#8B4513"/>
  <rect x="11" y="24" width="10" height="3" fill="#A0522D"/>
  <rect x="12" y="25" width="8" height="2" fill="#D2B48C"/>

  <!-- Pattes courtes -->
  <rect x="11" y="27" width="2" height="1" fill="#8B4513"/>
  <rect x="19" y="27" width="2" height="1" fill="#8B4513"/>

  <!-- Queue relevée (content) -->
  <rect x="21" y="21" width="2" height="4" fill="#8B4513"/>
  <rect x="22" y="19" width="2" height="2" fill="#8B4513"/>
  <rect x="23" y="19" width="1" height="1" fill="#A0522D"/>

  <!-- Étoiles de joie -->
  <rect x="5" y="14" width="1" height="1" fill="#FFD700"/>
  <rect x="4" y="15" width="1" height="1" fill="#FFD700"/>
  <rect x="6" y="15" width="1" height="1" fill="#FFD700"/>
  <rect x="5" y="16" width="1" height="1" fill="#FFD700"/>

  <rect x="26" y="14" width="1" height="1" fill="#FFD700"/>
  <rect x="25" y="15" width="1" height="1" fill="#FFD700"/>
  <rect x="27" y="15" width="1" height="1" fill="#FFD700"/>
  <rect x="26" y="16" width="1" height="1" fill="#FFD700"/>
</svg>
