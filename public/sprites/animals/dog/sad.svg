<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Chien Sad - Triste avec oreilles tombantes -->

  <!-- Oreilles tombantes (plus basses) -->
  <rect x="8" y="11" width="3" height="6" fill="#8B4513"/>
  <rect x="9" y="12" width="1" height="4" fill="#A0522D"/>
  <rect x="21" y="11" width="3" height="6" fill="#8B4513"/>
  <rect x="22" y="12" width="1" height="4" fill="#A0522D"/>

  <!-- Ombres oreilles -->
  <rect x="8" y="16" width="2" height="1" fill="#6B3410"/>
  <rect x="22" y="16" width="2" height="1" fill="#6B3410"/>

  <!-- Contour tête -->
  <rect x="10" y="12" width="12" height="2" fill="#6B3410"/>
  <rect x="9" y="14" width="14" height="10" fill="#6B3410"/>

  <!-- Tête principale -->
  <rect x="11" y="13" width="10" height="11" fill="#8B4513"/>

  <!-- Museau clair -->
  <rect x="11" y="17" width="10" height="7" fill="#D2B48C"/>
  <rect x="12" y="18" width="8" height="5" fill="#E8D5B7"/>

  <!-- Yeux tristes (avec sourcils) -->
  <rect x="12" y="15" width="3" height="1" fill="#2C3E50"/>
  <rect x="13" y="16" width="2" height="2" fill="#2C3E50"/>
  <rect x="13" y="16" width="1" height="1" fill="#7F8C8D"/>

  <rect x="17" y="15" width="3" height="1" fill="#2C3E50"/>
  <rect x="18" y="16" width="2" height="2" fill="#2C3E50"/>
  <rect x="18" y="16" width="1" height="1" fill="#7F8C8D"/>

  <!-- Larmes qui coulent -->
  <rect x="13" y="18" width="1" height="3" fill="#6CB4E8"/>
  <rect x="12" y="19" width="1" height="2" fill="#6CB4E8"/>
  <rect x="13" y="21" width="1" height="1" fill="#4A90E2"/>
  <rect x="12" y="22" width="1" height="1" fill="#4A90E2"/>

  <rect x="18" y="18" width="1" height="3" fill="#6CB4E8"/>
  <rect x="19" y="19" width="1" height="2" fill="#6CB4E8"/>
  <rect x="18" y="21" width="1" height="1" fill="#4A90E2"/>
  <rect x="19" y="22" width="1" height="1" fill="#4A90E2"/>

  <!-- Nez -->
  <rect x="15" y="19" width="2" height="2" fill="#1C1C1C"/>
  <rect x="14" y="20" width="4" height="1" fill="#2C3E50"/>

  <!-- Bouche triste (inversée) -->
  <rect x="14" y="22" width="1" height="1" fill="#2C3E50"/>
  <rect x="15" y="21" width="2" height="1" fill="#2C3E50"/>
  <rect x="17" y="22" width="1" height="1" fill="#2C3E50"/>

  <!-- Corps affaissé -->
  <rect x="10" y="24" width="12" height="4" fill="#8B4513"/>
  <rect x="11" y="25" width="10" height="2" fill="#A0522D"/>

  <!-- Pattes -->
  <rect x="11" y="27" width="2" height="1" fill="#8B4513"/>
  <rect x="19" y="27" width="2" height="1" fill="#8B4513"/>

  <!-- Queue basse (triste) -->
  <rect x="10" y="26" width="2" height="2" fill="#8B4513"/>
  <rect x="9" y="27" width="2" height="1" fill="#A0522D"/>
  <rect x="8" y="27" width="1" height="1" fill="#6B3410"/>
</svg>
