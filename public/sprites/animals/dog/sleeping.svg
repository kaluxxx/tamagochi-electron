<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Chien Sleeping - Endormi couché sur le côté -->

  <!-- Oreille visible (couchée) -->
  <rect x="11" y="13" width="2" height="3" fill="#8B4513"/>
  <rect x="12" y="14" width="1" height="1" fill="#A0522D"/>

  <!-- Contour tête couchée -->
  <rect x="12" y="14" width="8" height="2" fill="#6B3410"/>
  <rect x="11" y="16" width="10" height="6" fill="#6B3410"/>

  <!-- Tête endormie -->
  <rect x="13" y="15" width="6" height="7" fill="#8B4513"/>
  <rect x="14" y="16" width="4" height="5" fill="#A0522D"/>

  <!-- Museau visible -->
  <rect x="14" y="18" width="4" height="3" fill="#D2B48C"/>

  <!-- Yeux fermés paisibles -->
  <rect x="14" y="17" width="2" height="1" fill="#2C3E50"/>
  <rect x="17" y="17" width="2" height="1" fill="#2C3E50"/>

  <!-- Petit nez -->
  <rect x="15" y="19" width="2" height="1" fill="#1C1C1C"/>

  <!-- Petite bouche fermée -->
  <rect x="16" y="20" width="1" height="1" fill="#34495E"/>

  <!-- Corps couché (long comme un corgi) -->
  <rect x="9" y="20" width="14" height="2" fill="#6B3410"/>
  <rect x="8" y="22" width="16" height="5" fill="#6B3410"/>

  <rect x="10" y="21" width="12" height="6" fill="#8B4513"/>
  <rect x="11" y="22" width="10" height="4" fill="#A0522D"/>
  <rect x="12" y="23" width="8" height="2" fill="#D2B48C"/>

  <!-- Pattes allongées -->
  <rect x="18" y="25" width="4" height="2" fill="#8B4513"/>
  <rect x="19" y="26" width="2" height="1" fill="#A0522D"/>

  <!-- Queue détendue -->
  <rect x="7" y="23" width="3" height="2" fill="#8B4513"/>
  <rect x="6" y="24" width="2" height="1" fill="#A0522D"/>

  <!-- ZZZ -->
  <rect x="22" y="15" width="3" height="1" fill="#7F8C8D"/>
  <rect x="23" y="16" width="2" height="1" fill="#7F8C8D"/>
  <rect x="22" y="17" width="3" height="1" fill="#7F8C8D"/>

  <rect x="24" y="12" width="3" height="1" fill="#95A5A6"/>
  <rect x="25" y="13" width="2" height="1" fill="#95A5A6"/>
  <rect x="24" y="14" width="3" height="1" fill="#95A5A6"/>

  <rect x="26" y="9" width="2" height="1" fill="#BDC3C7"/>
  <rect x="27" y="10" width="2" height="1" fill="#BDC3C7"/>
  <rect x="26" y="11" width="2" height="1" fill="#BDC3C7"/>

  <!-- Petit coussin -->
  <rect x="11" y="26" width="3" height="1" fill="#E8F0F8"/>
</svg>
