<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Chien Tired - Fatigué, yeux mi-clos -->

  <!-- Oreilles tombantes -->
  <rect x="8" y="10" width="3" height="5" fill="#8B4513"/>
  <rect x="9" y="11" width="1" height="3" fill="#A0522D"/>
  <rect x="21" y="10" width="3" height="5" fill="#8B4513"/>
  <rect x="22" y="11" width="1" height="3" fill="#A0522D"/>

  <!-- Contour tête -->
  <rect x="10" y="11" width="12" height="2" fill="#6B3410"/>
  <rect x="9" y="13" width="14" height="10" fill="#6B3410"/>

  <!-- Tête principale -->
  <rect x="11" y="12" width="10" height="11" fill="#8B4513"/>

  <!-- Haut du crâne plus foncé -->
  <rect x="12" y="13" width="8" height="2" fill="#A0522D"/>

  <!-- Museau clair -->
  <rect x="11" y="16" width="10" height="7" fill="#D2B48C"/>
  <rect x="12" y="17" width="8" height="5" fill="#E8D5B7"/>

  <!-- Yeux mi-clos (fatigués) -->
  <rect x="13" y="14" width="2" height="3" fill="#E8D5B7"/>
  <rect x="13" y="15" width="2" height="2" fill="#2C3E50"/>
  <rect x="13" y="15" width="1" height="1" fill="#7F8C8D"/>

  <rect x="17" y="14" width="2" height="3" fill="#E8D5B7"/>
  <rect x="17" y="15" width="2" height="2" fill="#2C3E50"/>
  <rect x="17" y="15" width="1" height="1" fill="#7F8C8D"/>

  <!-- Paupières fatiguées -->
  <rect x="13" y="14" width="2" height="1" fill="#A0522D"/>
  <rect x="17" y="14" width="2" height="1" fill="#A0522D"/>

  <!-- Nez détaillé -->
  <rect x="15" y="18" width="2" height="2" fill="#1C1C1C"/>
  <rect x="14" y="19" width="4" height="1" fill="#2C3E50"/>
  <rect x="15" y="19" width="1" height="1" fill="#7F8C8D"/>

  <!-- Bouche fatiguée -->
  <rect x="14" y="20" width="4" height="1" fill="#2C3E50"/>
  <rect x="15" y="21" width="2" height="1" fill="#34495E"/>

  <!-- Taches sur le museau -->
  <rect x="12" y="18" width="1" height="1" fill="#A0522D"/>
  <rect x="19" y="18" width="1" height="1" fill="#A0522D"/>

  <!-- Corps affaissé -->
  <rect x="10" y="23" width="12" height="6" fill="#8B4513"/>
  <rect x="11" y="24" width="10" height="4" fill="#A0522D"/>
  <rect x="12" y="25" width="8" height="3" fill="#D2B48C"/>

  <!-- Pattes avant -->
  <rect x="12" y="27" width="2" height="1" fill="#8B4513"/>
  <rect x="18" y="27" width="2" height="1" fill="#8B4513"/>

  <!-- Queue tombante -->
  <rect x="21" y="25" width="2" height="3" fill="#8B4513"/>
  <rect x="23" y="26" width="1" height="2" fill="#8B4513"/>
  <rect x="24" y="27" width="1" height="1" fill="#A0522D"/>

  <!-- Détail poitrine -->
  <rect x="14" y="26" width="4" height="1" fill="#E8D5B7"/>
</svg>
