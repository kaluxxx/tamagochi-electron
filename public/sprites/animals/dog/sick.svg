<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Chien Sick - Malade avec teint verdâtre -->

  <!-- Oreilles tombantes (affaiblies) -->
  <rect x="8" y="10" width="3" height="6" fill="#6B8B6B"/>
  <rect x="9" y="11" width="1" height="4" fill="#7B9B7B"/>
  <rect x="21" y="10" width="3" height="6" fill="#6B8B6B"/>
  <rect x="22" y="11" width="1" height="4" fill="#7B9B7B"/>

  <!-- Contour tête -->
  <rect x="10" y="11" width="12" height="2" fill="#4A6B4A"/>
  <rect x="9" y="13" width="14" height="10" fill="#4A6B4A"/>

  <!-- Tête principale (teint verdâtre) -->
  <rect x="11" y="12" width="10" height="11" fill="#6B8B6B"/>

  <!-- Haut du crâne -->
  <rect x="12" y="13" width="8" height="2" fill="#7B9B7B"/>

  <!-- Museau (pâle/malade) -->
  <rect x="11" y="16" width="10" height="7" fill="#B8C8B8"/>
  <rect x="12" y="17" width="8" height="5" fill="#C8D8C8"/>

  <!-- Yeux mi-clos (fatigués/malades) -->
  <rect x="13" y="14" width="2" height="2" fill="#2C3E50"/>
  <rect x="13" y="14" width="1" height="1" fill="#7F8C8D"/>
  <rect x="14" y="15" width="1" height="1" fill="#7F8C8D"/>

  <rect x="17" y="14" width="2" height="2" fill="#2C3E50"/>
  <rect x="18" y="14" width="1" height="1" fill="#7F8C8D"/>
  <rect x="17" y="15" width="1" height="1" fill="#7F8C8D"/>

  <!-- Sourcils inquiets -->
  <rect x="12" y="13" width="2" height="1" fill="#3A5A3A"/>
  <rect x="18" y="13" width="2" height="1" fill="#3A5A3A"/>

  <!-- Nez (légèrement rouge/enflammé) -->
  <rect x="15" y="18" width="2" height="2" fill="#8B4040"/>
  <rect x="14" y="19" width="4" height="1" fill="#5A3030"/>
  <rect x="15" y="19" width="1" height="1" fill="#6B5050"/>

  <!-- Bouche nauséeuse -->
  <rect x="14" y="20" width="1" height="1" fill="#3A5A3A"/>
  <rect x="15" y="21" width="2" height="1" fill="#3A5A3A"/>
  <rect x="17" y="20" width="1" height="1" fill="#3A5A3A"/>

  <!-- Gouttes de sueur -->
  <rect x="10" y="14" width="1" height="2" fill="#87CEEB"/>
  <rect x="10" y="16" width="1" height="1" fill="#5DADE2"/>
  <rect x="21" y="15" width="1" height="2" fill="#87CEEB"/>
  <rect x="21" y="17" width="1" height="1" fill="#5DADE2"/>

  <!-- Taches sur le museau -->
  <rect x="12" y="18" width="1" height="1" fill="#7B9B7B"/>
  <rect x="19" y="18" width="1" height="1" fill="#7B9B7B"/>

  <!-- Corps affaissé -->
  <rect x="10" y="23" width="12" height="6" fill="#6B8B6B"/>
  <rect x="11" y="24" width="10" height="4" fill="#7B9B7B"/>
  <rect x="12" y="25" width="8" height="3" fill="#B8C8B8"/>

  <!-- Pattes avant -->
  <rect x="12" y="27" width="2" height="1" fill="#6B8B6B"/>
  <rect x="18" y="27" width="2" height="1" fill="#6B8B6B"/>

  <!-- Queue tombante -->
  <rect x="21" y="25" width="2" height="2" fill="#6B8B6B"/>
  <rect x="22" y="27" width="1" height="1" fill="#4A6B4A"/>

  <!-- Détail poitrine -->
  <rect x="14" y="26" width="4" height="1" fill="#C8D8C8"/>
</svg>
