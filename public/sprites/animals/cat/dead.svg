<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Chat Dead - Décédé en gris avec yeux X -->

  <!-- Oreilles tombantes -->
  <rect x="7" y="9" width="4" height="5" fill="#7F8C8D"/>
  <rect x="8" y="10" width="2" height="3" fill="#95A5A6"/>
  <rect x="21" y="9" width="4" height="5" fill="#7F8C8D"/>
  <rect x="22" y="10" width="2" height="3" fill="#95A5A6"/>

  <!-- Ombres oreilles -->
  <rect x="7" y="13" width="3" height="1" fill="#6C7A89"/>
  <rect x="22" y="13" width="3" height="1" fill="#6C7A89"/>

  <!-- Contour tête -->
  <rect x="9" y="11" width="14" height="2" fill="#6C7A89"/>
  <rect x="8" y="13" width="16" height="10" fill="#6C7A89"/>

  <!-- Tête principale -->
  <rect x="10" y="12" width="12" height="11" fill="#7F8C8D"/>

  <!-- Face intérieure -->
  <rect x="11" y="14" width="10" height="7" fill="#95A5A6"/>
  <rect x="12" y="15" width="8" height="5" fill="#B4BCC2"/>

  <!-- Yeux en X (mort) -->
  <!-- Oeil gauche X -->
  <rect x="12" y="16" width="1" height="1" fill="#2C3E50"/>
  <rect x="13" y="17" width="1" height="1" fill="#2C3E50"/>
  <rect x="14" y="16" width="1" height="1" fill="#2C3E50"/>
  <rect x="13" y="16" width="1" height="1" fill="#2C3E50"/>
  <rect x="12" y="18" width="1" height="1" fill="#2C3E50"/>
  <rect x="14" y="18" width="1" height="1" fill="#2C3E50"/>

  <!-- Oeil droit X -->
  <rect x="17" y="16" width="1" height="1" fill="#2C3E50"/>
  <rect x="18" y="17" width="1" height="1" fill="#2C3E50"/>
  <rect x="19" y="16" width="1" height="1" fill="#2C3E50"/>
  <rect x="18" y="16" width="1" height="1" fill="#2C3E50"/>
  <rect x="17" y="18" width="1" height="1" fill="#2C3E50"/>
  <rect x="19" y="18" width="1" height="1" fill="#2C3E50"/>

  <!-- Nez -->
  <rect x="15" y="18" width="2" height="2" fill="#AAB7C0"/>
  <rect x="15" y="19" width="1" height="1" fill="#B4BCC2"/>

  <!-- Bouche neutre/triste -->
  <rect x="14" y="21" width="4" height="1" fill="#2C3E50"/>

  <!-- Moustaches tombantes -->
  <rect x="7" y="17" width="3" height="1" fill="#5C6A74"/>
  <rect x="7" y="19" width="2" height="1" fill="#5C6A74"/>
  <rect x="22" y="17" width="3" height="1" fill="#5C6A74"/>
  <rect x="23" y="19" width="2" height="1" fill="#5C6A74"/>

  <!-- Corps couché -->
  <rect x="12" y="23" width="8" height="3" fill="#7F8C8D"/>
  <rect x="13" y="24" width="6" height="1" fill="#95A5A6"/>

  <!-- Queue tombante -->
  <rect x="11" y="24" width="2" height="1" fill="#7F8C8D"/>
  <rect x="10" y="25" width="2" height="1" fill="#6C7A89"/>

  <!-- Symbole âme (optionnel - petit halo) -->
  <rect x="15" y="8" width="2" height="1" fill="#FFFFFF" opacity="0.6"/>
  <rect x="14" y="9" width="1" height="1" fill="#FFFFFF" opacity="0.6"/>
  <rect x="17" y="9" width="1" height="1" fill="#FFFFFF" opacity="0.6"/>
</svg>
