<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Chat Sleeping - Endormi en boule, plus reconnaissable -->

  <!-- Oreilles visibles -->
  <rect x="10" y="12" width="3" height="3" fill="#FF8C42"/>
  <rect x="11" y="13" width="1" height="1" fill="#FFB366"/>

  <rect x="19" y="12" width="3" height="3" fill="#FF8C42"/>
  <rect x="20" y="13" width="1" height="1" fill="#FFB366"/>

  <!-- Contour tête arrondie -->
  <rect x="11" y="14" width="10" height="2" fill="#E07020"/>
  <rect x="10" y="16" width="12" height="6" fill="#E07020"/>

  <!-- Tête endormie -->
  <rect x="12" y="15" width="8" height="7" fill="#FF8C42"/>
  <rect x="13" y="16" width="6" height="5" fill="#FFB366"/>

  <!-- Yeux fermés (paisibles) -->
  <rect x="14" y="17" width="2" height="1" fill="#2C3E50"/>
  <rect x="18" y="17" width="2" height="1" fill="#2C3E50"/>

  <!-- Cils/paupières -->
  <rect x="14" y="18" width="2" height="1" fill="#34495E"/>
  <rect x="18" y="18" width="2" height="1" fill="#34495E"/>

  <!-- Petit nez -->
  <rect x="16" y="19" width="1" height="1" fill="#FF6B9D"/>

  <!-- Petit sourire endormi -->
  <rect x="16" y="20" width="1" height="1" fill="#34495E"/>

  <!-- Corps enroulé en boule -->
  <rect x="8" y="20" width="16" height="2" fill="#E07020"/>
  <rect x="7" y="22" width="18" height="5" fill="#E07020"/>

  <rect x="9" y="21" width="14" height="6" fill="#FF8C42"/>
  <rect x="10" y="22" width="12" height="4" fill="#FFB366"/>
  <rect x="11" y="23" width="10" height="2" fill="#FFDAA0"/>

  <!-- Queue enroulée autour du corps -->
  <rect x="6" y="23" width="3" height="3" fill="#FF8C42"/>
  <rect x="7" y="24" width="2" height="2" fill="#FFB366"/>
  <rect x="6" y="20" width="2" height="3" fill="#FF8C42"/>

  <!-- Pattes rentrées (suggestion) -->
  <rect x="20" y="24" width="3" height="2" fill="#FF8C42"/>
  <rect x="21" y="25" width="1" height="1" fill="#FFB366"/>

  <!-- Rayures de chat (détail) -->
  <rect x="12" y="22" width="1" height="1" fill="#E07020"/>
  <rect x="14" y="23" width="1" height="1" fill="#E07020"/>
  <rect x="17" y="22" width="1" height="1" fill="#E07020"/>

  <!-- ZZZ bien placés -->
  <!-- Premier Z (proche) -->
  <rect x="22" y="14" width="3" height="1" fill="#7F8C8D"/>
  <rect x="23" y="15" width="2" height="1" fill="#7F8C8D"/>
  <rect x="22" y="16" width="3" height="1" fill="#7F8C8D"/>

  <!-- Deuxième Z (moyen) -->
  <rect x="24" y="11" width="3" height="1" fill="#95A5A6"/>
  <rect x="25" y="12" width="2" height="1" fill="#95A5A6"/>
  <rect x="24" y="13" width="3" height="1" fill="#95A5A6"/>

  <!-- Troisième Z (loin) -->
  <rect x="26" y="8" width="2" height="1" fill="#BDC3C7"/>
  <rect x="27" y="9" width="2" height="1" fill="#BDC3C7"/>
  <rect x="26" y="10" width="2" height="1" fill="#BDC3C7"/>
</svg>
