<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Chat Happy - Style Tamagotchi détaillé -->

  <!-- Ombres des oreilles -->
  <rect x="7" y="8" width="3" height="1" fill="#E07020"/>
  <rect x="22" y="8" width="3" height="1" fill="#E07020"/>

  <!-- Oreilles gauche -->
  <rect x="7" y="7" width="4" height="5" fill="#FF8C42"/>
  <rect x="8" y="8" width="2" height="3" fill="#FFB366"/>
  <rect x="9" y="9" width="1" height="1" fill="#FFDAA0"/>

  <!-- Oreilles droite -->
  <rect x="21" y="7" width="4" height="5" fill="#FF8C42"/>
  <rect x="22" y="8" width="2" height="3" fill="#FFB366"/>
  <rect x="22" y="9" width="1" height="1" fill="#FFDAA0"/>

  <!-- Contour tête -->
  <rect x="9" y="10" width="14" height="2" fill="#E07020"/>
  <rect x="8" y="12" width="16" height="10" fill="#E07020"/>

  <!-- Tête principale -->
  <rect x="10" y="11" width="12" height="11" fill="#FF8C42"/>

  <!-- Face intérieure (plus claire) -->
  <rect x="11" y="13" width="10" height="7" fill="#FFB366"/>
  <rect x="12" y="14" width="8" height="5" fill="#FFDAA0"/>

  <!-- Yeux fermés (content) -->
  <rect x="12" y="15" width="3" height="1" fill="#2C3E50"/>
  <rect x="13" y="16" width="2" height="1" fill="#2C3E50"/>
  <rect x="17" y="15" width="3" height="1" fill="#2C3E50"/>
  <rect x="18" y="16" width="2" height="1" fill="#2C3E50"/>

  <!-- Joues roses -->
  <rect x="11" y="17" width="2" height="2" fill="#FFB3C1"/>
  <rect x="19" y="17" width="2" height="2" fill="#FFB3C1"/>

  <!-- Nez détaillé -->
  <rect x="15" y="17" width="2" height="2" fill="#FF6B9D"/>
  <rect x="15" y="18" width="1" height="1" fill="#FF8BB0"/>

  <!-- Bouche souriante -->
  <rect x="14" y="19" width="1" height="1" fill="#2C3E50"/>
  <rect x="15" y="20" width="2" height="1" fill="#2C3E50"/>
  <rect x="17" y="19" width="1" height="1" fill="#2C3E50"/>

  <!-- Moustaches -->
  <rect x="7" y="16" width="3" height="1" fill="#34495E"/>
  <rect x="7" y="18" width="3" height="1" fill="#34495E"/>
  <rect x="22" y="16" width="3" height="1" fill="#34495E"/>
  <rect x="22" y="18" width="3" height="1" fill="#34495E"/>

  <!-- Corps (hint) -->
  <rect x="12" y="22" width="8" height="4" fill="#FF8C42"/>
  <rect x="13" y="23" width="6" height="2" fill="#FFB366"/>

  <!-- Queue -->
  <rect x="20" y="23" width="3" height="1" fill="#FF8C42"/>
  <rect x="21" y="24" width="2" height="1" fill="#FF8C42"/>
  <rect x="22" y="25" width="1" height="1" fill="#E07020"/>

  <!-- Étoiles brillantes (happy) -->
  <rect x="5" y="13" width="1" height="1" fill="#FFD700"/>
  <rect x="4" y="14" width="1" height="1" fill="#FFD700"/>
  <rect x="6" y="14" width="1" height="1" fill="#FFD700"/>
  <rect x="5" y="15" width="1" height="1" fill="#FFD700"/>

  <rect x="26" y="13" width="1" height="1" fill="#FFD700"/>
  <rect x="25" y="14" width="1" height="1" fill="#FFD700"/>
  <rect x="27" y="14" width="1" height="1" fill="#FFD700"/>
  <rect x="26" y="15" width="1" height="1" fill="#FFD700"/>

  <!-- Petites étoiles -->
  <rect x="6" y="10" width="1" height="1" fill="#FFF4A3"/>
  <rect x="25" y="10" width="1" height="1" fill="#FFF4A3"/>
</svg>
