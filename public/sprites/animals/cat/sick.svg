<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Chat Sick - Malade avec teint verdâtre -->

  <!-- Oreilles tombantes (affaiblies) -->
  <rect x="7" y="9" width="4" height="5" fill="#8FB38F"/>
  <rect x="8" y="10" width="2" height="3" fill="#A8C8A8"/>
  <rect x="21" y="9" width="4" height="5" fill="#8FB38F"/>
  <rect x="22" y="10" width="2" height="3" fill="#A8C8A8"/>

  <!-- Ombres oreilles -->
  <rect x="7" y="13" width="3" height="1" fill="#6B8B6B"/>
  <rect x="22" y="13" width="3" height="1" fill="#6B8B6B"/>

  <!-- Contour tête -->
  <rect x="9" y="11" width="14" height="2" fill="#6B8B6B"/>
  <rect x="8" y="13" width="16" height="10" fill="#6B8B6B"/>

  <!-- Tête principale (teint verdâtre) -->
  <rect x="10" y="12" width="12" height="11" fill="#8FB38F"/>

  <!-- Face intérieure (plus verte/malade) -->
  <rect x="11" y="14" width="10" height="7" fill="#A8C8A8"/>
  <rect x="12" y="15" width="8" height="5" fill="#C0D8C0"/>

  <!-- Yeux mi-clos (fatigués/malades) -->
  <rect x="12" y="16" width="3" height="2" fill="#2C3E50"/>
  <rect x="12" y="16" width="1" height="1" fill="#7F8C8D"/>
  <rect x="13" y="17" width="1" height="1" fill="#7F8C8D"/>

  <rect x="17" y="16" width="3" height="2" fill="#2C3E50"/>
  <rect x="19" y="16" width="1" height="1" fill="#7F8C8D"/>
  <rect x="18" y="17" width="1" height="1" fill="#7F8C8D"/>

  <!-- Sourcils inquiets -->
  <rect x="12" y="15" width="2" height="1" fill="#4A5A4A"/>
  <rect x="18" y="15" width="2" height="1" fill="#4A5A4A"/>

  <!-- Nez (légèrement rouge/enflammé) -->
  <rect x="15" y="18" width="2" height="2" fill="#E08080"/>
  <rect x="15" y="18" width="1" height="1" fill="#EFA0A0"/>

  <!-- Bouche nauséeuse (ondulée) -->
  <rect x="14" y="20" width="1" height="1" fill="#4A5A4A"/>
  <rect x="15" y="21" width="2" height="1" fill="#4A5A4A"/>
  <rect x="17" y="20" width="1" height="1" fill="#4A5A4A"/>

  <!-- Gouttes de sueur -->
  <rect x="10" y="14" width="1" height="2" fill="#87CEEB"/>
  <rect x="10" y="16" width="1" height="1" fill="#5DADE2"/>
  <rect x="21" y="15" width="1" height="2" fill="#87CEEB"/>
  <rect x="21" y="17" width="1" height="1" fill="#5DADE2"/>

  <!-- Moustaches tombantes -->
  <rect x="7" y="17" width="3" height="1" fill="#34495E"/>
  <rect x="7" y="19" width="2" height="1" fill="#34495E"/>
  <rect x="22" y="17" width="3" height="1" fill="#34495E"/>
  <rect x="23" y="19" width="2" height="1" fill="#34495E"/>

  <!-- Corps affaissé -->
  <rect x="12" y="23" width="8" height="3" fill="#8FB38F"/>
  <rect x="13" y="24" width="6" height="1" fill="#A8C8A8"/>

  <!-- Queue tombante -->
  <rect x="11" y="24" width="2" height="1" fill="#8FB38F"/>
  <rect x="10" y="25" width="2" height="1" fill="#6B8B6B"/>
</svg>
