<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Chat Hungry - Affamé avec langue tirée -->

  <!-- Oreilles -->
  <rect x="7" y="7" width="4" height="5" fill="#FF8C42"/>
  <rect x="8" y="8" width="2" height="3" fill="#FFB366"/>
  <rect x="21" y="7" width="4" height="5" fill="#FF8C42"/>
  <rect x="22" y="8" width="2" height="3" fill="#FFB366"/>

  <!-- Contour tête -->
  <rect x="9" y="10" width="14" height="2" fill="#E07020"/>
  <rect x="8" y="12" width="16" height="11" fill="#E07020"/>

  <!-- Tête principale -->
  <rect x="10" y="11" width="12" height="12" fill="#FF8C42"/>

  <!-- Face intérieure -->
  <rect x="11" y="13" width="10" height="8" fill="#FFB366"/>
  <rect x="12" y="14" width="8" height="6" fill="#FFDAA0"/>

  <!-- Yeux inquiets/affamés -->
  <rect x="12" y="14" width="2" height="3" fill="#2C3E50"/>
  <rect x="13" y="14" width="1" height="1" fill="#FFFFFF"/>
  <rect x="12" y="16" width="2" height="1" fill="#34495E"/>

  <rect x="18" y="14" width="2" height="3" fill="#2C3E50"/>
  <rect x="18" y="14" width="1" height="1" fill="#FFFFFF"/>
  <rect x="18" y="16" width="2" height="1" fill="#34495E"/>

  <!-- Nez -->
  <rect x="15" y="17" width="2" height="1" fill="#FF6B9D"/>

  <!-- Bouche grande ouverte (affamé) -->
  <rect x="14" y="18" width="4" height="4" fill="#34495E"/>
  <rect x="15" y="19" width="2" height="2" fill="#2C3E50"/>

  <!-- Langue tirée -->
  <rect x="15" y="21" width="2" height="2" fill="#FF6B9D"/>
  <rect x="16" y="22" width="1" height="1" fill="#FF8BB0"/>

  <!-- Bave/salive -->
  <rect x="18" y="21" width="1" height="1" fill="#6CB4E8"/>
  <rect x="18" y="22" width="1" height="2" fill="#6CB4E8"/>

  <!-- Moustaches -->
  <rect x="7" y="16" width="3" height="1" fill="#34495E"/>
  <rect x="7" y="18" width="3" height="1" fill="#34495E"/>
  <rect x="22" y="16" width="3" height="1" fill="#34495E"/>
  <rect x="22" y="18" width="3" height="1" fill="#34495E"/>

  <!-- Corps avec ventre -->
  <rect x="11" y="23" width="10" height="4" fill="#FF8C42"/>
  <rect x="12" y="24" width="8" height="2" fill="#FFB366"/>

  <!-- Ventre qui gargouille (lignes) -->
  <rect x="14" y="24" width="4" height="1" fill="#E07020"/>
  <rect x="13" y="25" width="6" height="1" fill="#E07020"/>

  <!-- Queue agitée -->
  <rect x="21" y="24" width="2" height="1" fill="#FF8C42"/>
  <rect x="22" y="23" width="2" height="1" fill="#FF8C42"/>
  <rect x="23" y="25" width="1" height="1" fill="#E07020"/>

  <!-- Symbole nourriture (pensée) -->
  <rect x="24" y="11" width="3" height="3" fill="#FFB366"/>
  <rect x="25" y="12" width="1" height="1" fill="#E07020"/>
</svg>
