<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Chat Sad - Triste avec larmes -->

  <!-- Oreilles tombantes (triste) -->
  <rect x="7" y="9" width="4" height="5" fill="#FF8C42"/>
  <rect x="8" y="10" width="2" height="3" fill="#FFB366"/>
  <rect x="21" y="9" width="4" height="5" fill="#FF8C42"/>
  <rect x="22" y="10" width="2" height="3" fill="#FFB366"/>

  <!-- Ombres oreilles -->
  <rect x="7" y="13" width="3" height="1" fill="#E07020"/>
  <rect x="22" y="13" width="3" height="1" fill="#E07020"/>

  <!-- Contour tête -->
  <rect x="9" y="11" width="14" height="2" fill="#E07020"/>
  <rect x="8" y="13" width="16" height="10" fill="#E07020"/>

  <!-- Tête principale -->
  <rect x="10" y="12" width="12" height="11" fill="#FF8C42"/>

  <!-- Face intérieure -->
  <rect x="11" y="14" width="10" height="7" fill="#FFB366"/>
  <rect x="12" y="15" width="8" height="5" fill="#FFDAA0"/>

  <!-- Yeux tristes (avec sourcils) -->
  <rect x="12" y="15" width="3" height="1" fill="#2C3E50"/>
  <rect x="12" y="16" width="2" height="2" fill="#2C3E50"/>
  <rect x="13" y="16" width="1" height="1" fill="#7F8C8D"/>

  <rect x="17" y="15" width="3" height="1" fill="#2C3E50"/>
  <rect x="18" y="16" width="2" height="2" fill="#2C3E50"/>
  <rect x="18" y="16" width="1" height="1" fill="#7F8C8D"/>

  <!-- Larmes détaillées -->
  <rect x="13" y="18" width="1" height="3" fill="#6CB4E8"/>
  <rect x="12" y="19" width="1" height="2" fill="#6CB4E8"/>
  <rect x="13" y="21" width="1" height="1" fill="#4A90E2"/>

  <rect x="18" y="18" width="1" height="3" fill="#6CB4E8"/>
  <rect x="19" y="19" width="1" height="2" fill="#6CB4E8"/>
  <rect x="18" y="21" width="1" height="1" fill="#4A90E2"/>

  <!-- Nez -->
  <rect x="15" y="18" width="2" height="2" fill="#FF6B9D"/>
  <rect x="15" y="19" width="1" height="1" fill="#FF8BB0"/>

  <!-- Bouche triste (inversée) -->
  <rect x="14" y="21" width="1" height="1" fill="#2C3E50"/>
  <rect x="15" y="20" width="2" height="1" fill="#2C3E50"/>
  <rect x="17" y="21" width="1" height="1" fill="#2C3E50"/>

  <!-- Moustaches tombantes -->
  <rect x="7" y="17" width="3" height="1" fill="#34495E"/>
  <rect x="7" y="19" width="2" height="1" fill="#34495E"/>
  <rect x="22" y="17" width="3" height="1" fill="#34495E"/>
  <rect x="23" y="19" width="2" height="1" fill="#34495E"/>

  <!-- Corps affaissé -->
  <rect x="12" y="23" width="8" height="3" fill="#FF8C42"/>
  <rect x="13" y="24" width="6" height="1" fill="#FFB366"/>

  <!-- Queue tombante -->
  <rect x="11" y="24" width="2" height="1" fill="#FF8C42"/>
  <rect x="10" y="25" width="2" height="1" fill="#E07020"/>
</svg>
