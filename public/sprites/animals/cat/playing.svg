<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Chat Playing - En position de bond, excité -->

  <!-- Oreilles dressées (alerte) -->
  <rect x="6" y="5" width="4" height="6" fill="#FF8C42"/>
  <rect x="7" y="6" width="2" height="4" fill="#FFB366"/>
  <rect x="8" y="7" width="1" height="2" fill="#FFDAA0"/>

  <rect x="22" y="5" width="4" height="6" fill="#FF8C42"/>
  <rect x="23" y="6" width="2" height="4" fill="#FFB366"/>
  <rect x="23" y="7" width="1" height="2" fill="#FFDAA0"/>

  <!-- Contour tête -->
  <rect x="9" y="9" width="14" height="2" fill="#E07020"/>
  <rect x="8" y="11" width="16" height="10" fill="#E07020"/>

  <!-- Tête principale -->
  <rect x="10" y="10" width="12" height="11" fill="#FF8C42"/>

  <!-- Face intérieure -->
  <rect x="11" y="12" width="10" height="7" fill="#FFB366"/>
  <rect x="12" y="13" width="8" height="5" fill="#FFDAA0"/>

  <!-- Yeux grands ouverts (excités) -->
  <rect x="12" y="14" width="3" height="3" fill="#2C3E50"/>
  <rect x="12" y="14" width="1" height="1" fill="#FFFFFF"/>
  <rect x="13" y="15" width="1" height="1" fill="#7F8C8D"/>
  <!-- Pupille dilatée -->
  <rect x="14" y="15" width="1" height="2" fill="#1C1C1C"/>

  <rect x="17" y="14" width="3" height="3" fill="#2C3E50"/>
  <rect x="17" y="14" width="1" height="1" fill="#FFFFFF"/>
  <rect x="18" y="15" width="1" height="1" fill="#7F8C8D"/>
  <rect x="19" y="15" width="1" height="2" fill="#1C1C1C"/>

  <!-- Nez -->
  <rect x="15" y="17" width="2" height="2" fill="#FF6B9D"/>
  <rect x="15" y="17" width="1" height="1" fill="#FF8BB0"/>

  <!-- Bouche ouverte (excité) -->
  <rect x="14" y="19" width="4" height="2" fill="#2C3E50"/>
  <rect x="15" y="20" width="2" height="1" fill="#FF6B9D"/>

  <!-- Moustaches -->
  <rect x="6" y="15" width="4" height="1" fill="#34495E"/>
  <rect x="6" y="17" width="4" height="1" fill="#34495E"/>
  <rect x="22" y="15" width="4" height="1" fill="#34495E"/>
  <rect x="22" y="17" width="4" height="1" fill="#34495E"/>

  <!-- Corps en position de bond (pattes avant levées) -->
  <rect x="10" y="21" width="12" height="5" fill="#FF8C42"/>
  <rect x="11" y="22" width="10" height="3" fill="#FFB366"/>

  <!-- Pattes avant levées -->
  <rect x="8" y="19" width="2" height="3" fill="#FF8C42"/>
  <rect x="9" y="20" width="1" height="1" fill="#FFB366"/>
  <rect x="22" y="19" width="2" height="3" fill="#FF8C42"/>
  <rect x="22" y="20" width="1" height="1" fill="#FFB366"/>

  <!-- Pattes arrière -->
  <rect x="12" y="25" width="3" height="2" fill="#FF8C42"/>
  <rect x="17" y="25" width="3" height="2" fill="#FF8C42"/>

  <!-- Queue dressée et courbée (excitation) -->
  <rect x="21" y="18" width="2" height="5" fill="#FF8C42"/>
  <rect x="23" y="16" width="2" height="3" fill="#FF8C42"/>
  <rect x="24" y="15" width="2" height="2" fill="#FF8C42"/>
  <rect x="25" y="16" width="1" height="1" fill="#FFB366"/>

  <!-- Lignes de mouvement -->
  <rect x="4" y="12" width="2" height="1" fill="#FFD700"/>
  <rect x="3" y="14" width="3" height="1" fill="#FFD700"/>
  <rect x="4" y="16" width="2" height="1" fill="#FFD700"/>

  <rect x="26" y="12" width="2" height="1" fill="#FFD700"/>
  <rect x="26" y="14" width="3" height="1" fill="#FFD700"/>
  <rect x="26" y="16" width="2" height="1" fill="#FFD700"/>

  <!-- Petite balle de jeu -->
  <rect x="5" y="22" width="3" height="3" fill="#FF6B6B"/>
  <rect x="6" y="23" width="1" height="1" fill="#FF8B8B"/>
</svg>
