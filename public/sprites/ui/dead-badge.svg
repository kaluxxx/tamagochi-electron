<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Dead Badge - Crâne pixel art -->

  <!-- Ombre -->
  <rect x="11" y="25" width="10" height="1" fill="#D0D0D0"/>

  <!-- Contour crâne -->
  <rect x="12" y="9" width="8" height="2" fill="#ECF0F1"/>
  <rect x="10" y="11" width="12" height="8" fill="#ECF0F1"/>
  <rect x="12" y="19" width="8" height="2" fill="#BDC3C7"/>

  <!-- Crâne principal -->
  <rect x="13" y="10" width="6" height="10" fill="#FFFFFF"/>
  <rect x="14" y="11" width="4" height="8" fill="#FEFEFE"/>

  <!-- Haut du crâne (arrondi) -->
  <rect x="13" y="10" width="6" height="3" fill="#FFFFFF"/>
  <rect x="14" y="11" width="4" height="2" fill="#FEFEFE"/>

  <!-- Orbites des yeux (grandes et noires) -->
  <rect x="13" y="13" width="2" height="3" fill="#1C1C1C"/>
  <rect x="14" y="14" width="1" height="1" fill="#2C3E50"/>

  <rect x="17" y="13" width="2" height="3" fill="#1C1C1C"/>
  <rect x="17" y="14" width="1" height="1" fill="#2C3E50"/>

  <!-- Nez (triangle inversé) -->
  <rect x="15" y="16" width="2" height="1" fill="#1C1C1C"/>
  <rect x="15" y="17" width="2" height="1" fill="#2C3E50"/>
  <rect x="16" y="18" width="1" height="1" fill="#1C1C1C"/>

  <!-- Mâchoire -->
  <rect x="12" y="19" width="8" height="3" fill="#ECF0F1"/>
  <rect x="13" y="20" width="6" height="1" fill="#FFFFFF"/>

  <!-- Dents (alternées) -->
  <rect x="13" y="20" width="1" height="2" fill="#FFFFFF"/>
  <rect x="15" y="20" width="1" height="2" fill="#FFFFFF"/>
  <rect x="17" y="20" width="1" height="2" fill="#FFFFFF"/>

  <!-- Séparations entre dents -->
  <rect x="14" y="20" width="1" height="2" fill="#BDC3C7"/>
  <rect x="16" y="20" width="1" height="2" fill="#BDC3C7"/>
  <rect x="18" y="20" width="1" height="2" fill="#BDC3C7"/>

  <!-- Ombres/contours -->
  <rect x="12" y="13" width="1" height="5" fill="#BDC3C7"/>
  <rect x="19" y="13" width="1" height="5" fill="#BDC3C7"/>

  <!-- Os croisés en dessous -->
  <!-- Os gauche (diagonal) -->
  <rect x="9" y="22" width="2" height="1" fill="#ECF0F1"/>
  <rect x="10" y="23" width="2" height="1" fill="#FFFFFF"/>
  <rect x="11" y="24" width="2" height="1" fill="#ECF0F1"/>

  <!-- Os droit (diagonal) -->
  <rect x="21" y="22" width="2" height="1" fill="#ECF0F1"/>
  <rect x="20" y="23" width="2" height="1" fill="#FFFFFF"/>
  <rect x="19" y="24" width="2" height="1" fill="#ECF0F1"/>

  <!-- Centre des os croisés -->
  <rect x="15" y="23" width="2" height="1" fill="#FFFFFF"/>

  <!-- Détails supplémentaires (fissures) -->
  <rect x="13" y="12" width="1" height="1" fill="#BDC3C7"/>
  <rect x="18" y="12" width="1" height="1" fill="#BDC3C7"/>
</svg>
