<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Logo Tamagotchi App - Écran LCD rétro avec créature -->

  <!-- Boîtier extérieur (rose Tamagotchi) -->
  <rect x="8" y="8" width="48" height="48" fill="#FF69B4"/>
  <rect x="6" y="10" width="52" height="44" fill="#FF1493"/>

  <!-- Bordure du boîtier (effet 3D) -->
  <rect x="8" y="8" width="48" height="4" fill="#FF85C1"/>
  <rect x="8" y="8" width="4" height="48" fill="#FF85C1"/>
  <rect x="8" y="52" width="48" height="4" fill="#C71585"/>
  <rect x="52" y="8" width="4" height="48" fill="#C71585"/>

  <!-- Écran LCD (fond vert menthe) -->
  <rect x="12" y="14" width="40" height="28" fill="#9ACD32"/>
  <rect x="14" y="16" width="36" height="24" fill="#B5D86C"/>

  <!-- Créature pixel art sur l'écran (mini Tamagotchi simplifié) -->
  <!-- Corps -->
  <rect x="26" y="22" width="12" height="10" fill="#2C3E50"/>
  <rect x="28" y="24" width="8" height="8" fill="#34495E"/>

  <!-- Yeux (grands et mignons) -->
  <rect x="29" y="25" width="2" height="2" fill="#FFFFFF"/>
  <rect x="33" y="25" width="2" height="2" fill="#FFFFFF"/>
  <rect x="30" y="26" width="1" height="1" fill="#2C3E50"/>
  <rect x="34" y="26" width="1" height="1" fill="#2C3E50"/>

  <!-- Bouche souriante -->
  <rect x="30" y="29" width="4" height="1" fill="#FFFFFF"/>
  <rect x="29" y="30" width="1" height="1" fill="#FFFFFF"/>
  <rect x="34" y="30" width="1" height="1" fill="#FFFFFF"/>

  <!-- Antennes -->
  <rect x="28" y="21" width="1" height="2" fill="#2C3E50"/>
  <rect x="35" y="21" width="1" height="2" fill="#2C3E50"/>
  <rect x="27" y="20" width="2" height="1" fill="#FFD700"/>
  <rect x="35" y="20" width="2" height="1" fill="#FFD700"/>

  <!-- Pieds -->
  <rect x="27" y="32" width="3" height="2" fill="#2C3E50"/>
  <rect x="34" y="32" width="3" height="2" fill="#2C3E50"/>

  <!-- Particules cœur autour (kawaii effect) -->
  <rect x="20" y="20" width="2" height="1" fill="#FF69B4"/>
  <rect x="19" y="21" width="4" height="1" fill="#FF69B4"/>
  <rect x="20" y="22" width="2" height="1" fill="#FF69B4"/>

  <rect x="42" y="20" width="2" height="1" fill="#FF69B4"/>
  <rect x="41" y="21" width="4" height="1" fill="#FF69B4"/>
  <rect x="42" y="22" width="2" height="1" fill="#FF69B4"/>

  <!-- Boutons sous l'écran (3 boutons ronds) -->
  <rect x="18" y="46" width="6" height="6" fill="#FFD700"/>
  <rect x="19" y="47" width="4" height="4" fill="#FFF4A3"/>

  <rect x="29" y="46" width="6" height="6" fill="#4A90E2"/>
  <rect x="30" y="47" width="4" height="4" fill="#7BB3F0"/>

  <rect x="40" y="46" width="6" height="6" fill="#2ECC71"/>
  <rect x="41" y="47" width="4" height="4" fill="#6FE09D"/>

  <!-- Reflets sur le boîtier -->
  <rect x="10" y="10" width="8" height="2" fill="#FFB3D9"/>
  <rect x="10" y="12" width="4" height="2" fill="#FFB3D9"/>

  <!-- Ombre portée -->
  <rect x="10" y="57" width="44" height="2" fill="#D0D0D0"/>
  <rect x="12" y="59" width="40" height="1" fill="#E0E0E0"/>
</svg>
