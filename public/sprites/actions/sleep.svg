<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Sleep Action - Lit avec oreiller -->

  <!-- Ombre -->
  <rect x="8" y="23" width="16" height="1" fill="#D0D0D0"/>

  <!-- Pied de lit gauche -->
  <rect x="8" y="19" width="2" height="4" fill="#8B4513"/>
  <rect x="9" y="20" width="1" height="2" fill="#A0522D"/>

  <!-- Pied de lit droite -->
  <rect x="22" y="19" width="2" height="4" fill="#8B4513"/>
  <rect x="22" y="20" width="1" height="2" fill="#A0522D"/>

  <!-- Cadre du lit -->
  <rect x="8" y="17" width="16" height="2" fill="#8B4513"/>
  <rect x="9" y="18" width="14" height="1" fill="#A0522D"/>

  <!-- Matelas -->
  <rect x="9" y="15" width="14" height="3" fill="#E8F0F8"/>
  <rect x="10" y="16" width="12" height="1" fill="#FFFFFF"/>

  <!-- Couverture/drap -->
  <rect x="10" y="14" width="12" height="2" fill="#87CEEB"/>
  <rect x="11" y="14" width="10" height="1" fill="#B0E0E6"/>

  <!-- Oreiller -->
  <rect x="12" y="11" width="8" height="3" fill="#FFFFFF"/>
  <rect x="13" y="12" width="6" height="1" fill="#FEFEFE"/>

  <!-- Contour oreiller -->
  <rect x="12" y="11" width="8" height="1" fill="#E8E8E8"/>
  <rect x="12" y="13" width="8" height="1" fill="#E8E8E8"/>

  <!-- Plis du drap -->
  <rect x="12" y="15" width="8" height="1" fill="#6CB4E8"/>
  <rect x="14" y="16" width="4" height="1" fill="#6CB4E8"/>

  <!-- ZZZ au-dessus (symbole sommeil) -->
  <!-- Premier Z -->
  <rect x="17" y="8" width="3" height="1" fill="#7F8C8D"/>
  <rect x="18" y="9" width="2" height="1" fill="#7F8C8D"/>
  <rect x="17" y="10" width="3" height="1" fill="#7F8C8D"/>

  <!-- Deuxième Z (plus petit) -->
  <rect x="20" y="6" width="2" height="1" fill="#95A5A6"/>
  <rect x="21" y="7" width="2" height="1" fill="#95A5A6"/>
  <rect x="20" y="8" width="2" height="1" fill="#95A5A6"/>

  <!-- Troisième Z (encore plus petit) -->
  <rect x="22" y="4" width="2" height="1" fill="#BDC3C7"/>
  <rect x="23" y="5" width="2" height="1" fill="#BDC3C7"/>
  <rect x="22" y="6" width="2" height="1" fill="#BDC3C7"/>

  <!-- Lune (symbole nuit) -->
  <rect x="10" y="6" width="3" height="4" fill="#F1C40F"/>
  <rect x="11" y="7" width="1" height="2" fill="#F9E79F"/>
  <rect x="12" y="7" width="1" height="1" fill="#FFFFFF"/>
</svg>
