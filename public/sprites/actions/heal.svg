<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Heal Action - Croix médicale / Trousse de soin -->

  <!-- Ombre -->
  <rect x="10" y="24" width="12" height="1" fill="#D0D0D0"/>

  <!-- Trousse médicale (fond) -->
  <rect x="9" y="13" width="14" height="2" fill="#C0392B"/>
  <rect x="8" y="15" width="16" height="7" fill="#C0392B"/>
  <rect x="9" y="22" width="14" height="2" fill="#A93226"/>

  <!-- Corps de la trousse -->
  <rect x="10" y="14" width="12" height="9" fill="#E74C3C"/>
  <rect x="11" y="15" width="10" height="7" fill="#EC7063"/>

  <!-- Poignée -->
  <rect x="14" y="10" width="4" height="3" fill="#A93226"/>
  <rect x="15" y="11" width="2" height="1" fill="#C0392B"/>

  <!-- Grande croix blanche -->
  <!-- Barre verticale -->
  <rect x="15" y="16" width="2" height="6" fill="#FFFFFF"/>
  <rect x="15" y="16" width="1" height="6" fill="#FEFEFE"/>

  <!-- Barre horizontale -->
  <rect x="13" y="18" width="6" height="2" fill="#FFFFFF"/>
  <rect x="13" y="18" width="6" height="1" fill="#FEFEFE"/>

  <!-- Ombre de la croix -->
  <rect x="16" y="17" width="1" height="4" fill="#ECF0F1"/>
  <rect x="14" y="19" width="4" height="1" fill="#ECF0F1"/>

  <!-- Fermoir -->
  <rect x="15" y="13" width="2" height="1" fill="#F39C12"/>
  <rect x="16" y="13" width="1" height="1" fill="#F8C471"/>

  <!-- Coins renforcés -->
  <rect x="10" y="15" width="1" height="1" fill="#A93226"/>
  <rect x="21" y="15" width="1" height="1" fill="#A93226"/>
  <rect x="10" y="21" width="1" height="1" fill="#A93226"/>
  <rect x="21" y="21" width="1" height="1" fill="#A93226"/>

  <!-- Étiquette/reflet -->
  <rect x="11" y="16" width="2" height="1" fill="#F1948A"/>

  <!-- Petites étoiles de soin (effet magique) -->
  <rect x="7" y="15" width="1" height="1" fill="#2ECC71"/>
  <rect x="24" y="15" width="1" height="1" fill="#2ECC71"/>
  <rect x="6" y="18" width="1" height="1" fill="#52D981"/>
  <rect x="25" y="18" width="1" height="1" fill="#52D981"/>
</svg>
