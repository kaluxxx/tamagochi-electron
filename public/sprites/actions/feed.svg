<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Feed Action - Bol avec nourriture -->

  <!-- Ombre -->
  <rect x="10" y="24" width="12" height="1" fill="#D0D0D0"/>

  <!-- Contour bol -->
  <rect x="9" y="14" width="14" height="2" fill="#E74C3C"/>
  <rect x="8" y="16" width="16" height="6" fill="#E74C3C"/>
  <rect x="10" y="22" width="12" height="2" fill="#C0392B"/>

  <!-- Intérieur bol -->
  <rect x="10" y="15" width="12" height="8" fill="#EC7063"/>
  <rect x="11" y="16" width="10" height="6" fill="#F1948A"/>

  <!-- Nourriture dans le bol (croquettes/morceaux) -->
  <rect x="12" y="17" width="3" height="2" fill="#8B4513"/>
  <rect x="13" y="18" width="1" height="1" fill="#A0522D"/>

  <rect x="16" y="17" width="3" height="2" fill="#8B4513"/>
  <rect x="17" y="18" width="1" height="1" fill="#A0522D"/>

  <rect x="14" y="19" width="3" height="2" fill="#8B4513"/>
  <rect x="15" y="20" width="1" height="1" fill="#A0522D"/>

  <!-- Highlight sur le bol -->
  <rect x="11" y="16" width="3" height="2" fill="#FADBD8"/>
  <rect x="12" y="17" width="1" height="1" fill="#FFFFFF"/>

  <!-- Base du bol -->
  <rect x="13" y="22" width="6" height="1" fill="#C0392B"/>

  <!-- Cuillère à droite -->
  <rect x="22" y="18" width="2" height="6" fill="#BDC3C7"/>
  <rect x="23" y="19" width="1" height="4" fill="#ECF0F1"/>

  <!-- Partie cuillère (ovale) -->
  <rect x="21" y="15" width="4" height="3" fill="#BDC3C7"/>
  <rect x="22" y="16" width="2" height="1" fill="#ECF0F1"/>
  <rect x="23" y="16" width="1" height="1" fill="#FFFFFF"/>

  <!-- Vapeur/odeur (symbole de nourriture chaude) -->
  <rect x="12" y="12" width="1" height="2" fill="#95A5A6"/>
  <rect x="11" y="11" width="1" height="1" fill="#BDC3C7"/>

  <rect x="15" y="11" width="1" height="2" fill="#95A5A6"/>
  <rect x="14" y="10" width="1" height="1" fill="#BDC3C7"/>

  <rect x="18" y="12" width="1" height="2" fill="#95A5A6"/>
  <rect x="17" y="11" width="1" height="1" fill="#BDC3C7"/>
</svg>
