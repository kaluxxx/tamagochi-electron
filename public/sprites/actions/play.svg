<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Play Action - Manette de jeu simplifiée -->

  <!-- Ombre -->
  <rect x="9" y="22" width="14" height="1" fill="#D0D0D0"/>

  <!-- Contour manette -->
  <rect x="8" y="12" width="16" height="2" fill="#5D6D7E"/>
  <rect x="7" y="14" width="18" height="6" fill="#5D6D7E"/>
  <rect x="8" y="20" width="16" height="2" fill="#34495E"/>

  <!-- Corps manette -->
  <rect x="9" y="13" width="14" height="8" fill="#7F8C8D"/>
  <rect x="10" y="14" width="12" height="6" fill="#95A5A6"/>

  <!-- Zone centrale -->
  <rect x="11" y="15" width="10" height="4" fill="#BDC3C7"/>

  <!-- Poignées -->
  <rect x="7" y="17" width="2" height="3" fill="#5D6D7E"/>
  <rect x="23" y="17" width="2" height="3" fill="#5D6D7E"/>

  <!-- D-pad (croix) -->
  <rect x="11" y="16" width="1" height="3" fill="#2C3E50"/>
  <rect x="10" y="17" width="3" height="1" fill="#2C3E50"/>
  <rect x="11" y="17" width="1" height="1" fill="#1C1C1C"/>

  <!-- Boutons ABXY (4 couleurs) -->
  <rect x="19" y="16" width="2" height="2" fill="#E74C3C"/>
  <rect x="19" y="16" width="1" height="1" fill="#EC7063"/>

  <rect x="21" y="17" width="2" height="2" fill="#3498DB"/>
  <rect x="21" y="17" width="1" height="1" fill="#5DADE2"/>

  <!-- Boutons L/R -->
  <rect x="9" y="13" width="3" height="1" fill="#34495E"/>
  <rect x="20" y="13" width="3" height="1" fill="#34495E"/>

  <!-- LED centrale -->
  <rect x="15" y="15" width="2" height="1" fill="#2ECC71"/>

  <!-- Étoiles de jeu -->
  <rect x="5" y="13" width="1" height="1" fill="#FFD700"/>
  <rect x="26" y="13" width="1" height="1" fill="#FFD700"/>
  <rect x="6" y="11" width="1" height="1" fill="#FFF4A3"/>
  <rect x="25" y="11" width="1" height="1" fill="#FFF4A3"/>
</svg>
