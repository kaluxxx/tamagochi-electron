<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Plush - Peluche ourson -->

  <!-- Ombre -->
  <rect x="11" y="25" width="10" height="1" fill="#D0D0D0"/>

  <!-- Oreilles -->
  <rect x="10" y="9" width="3" height="3" fill="#A0522D"/>
  <rect x="11" y="10" width="1" height="1" fill="#D2B48C"/>

  <rect x="19" y="9" width="3" height="3" fill="#A0522D"/>
  <rect x="20" y="10" width="1" height="1" fill="#D2B48C"/>

  <!-- Contour tête -->
  <rect x="11" y="11" width="10" height="2" fill="#A0522D"/>
  <rect x="10" y="13" width="12" height="6" fill="#A0522D"/>
  <rect x="11" y="19" width="10" height="1" fill="#8B4513"/>

  <!-- Tête -->
  <rect x="12" y="12" width="8" height="7" fill="#D2B48C"/>
  <rect x="13" y="13" width="6" height="5" fill="#E8D5B7"/>

  <!-- Museau clair -->
  <rect x="13" y="16" width="6" height="3" fill="#F5E6D3"/>
  <rect x="14" y="17" width="4" height="1" fill="#FFFFFF"/>

  <!-- Yeux (boutons cousus) -->
  <rect x="13" y="14" width="2" height="2" fill="#1C1C1C"/>
  <rect x="14" y="15" width="1" height="1" fill="#7F8C8D"/>

  <rect x="17" y="14" width="2" height="2" fill="#1C1C1C"/>
  <rect x="18" y="15" width="1" height="1" fill="#7F8C8D"/>

  <!-- Nez brodé -->
  <rect x="15" y="17" width="2" height="2" fill="#1C1C1C"/>
  <rect x="16" y="18" width="1" height="1" fill="#34495E"/>

  <!-- Bouche cousue -->
  <rect x="15" y="19" width="2" height="1" fill="#8B4513"/>

  <!-- Corps -->
  <rect x="11" y="20" width="10" height="4" fill="#D2B48C"/>
  <rect x="12" y="21" width="8" height="2" fill="#E8D5B7"/>

  <!-- Ventre clair -->
  <rect x="13" y="21" width="6" height="2" fill="#F5E6D3"/>

  <!-- Pattes -->
  <rect x="11" y="24" width="3" height="1" fill="#A0522D"/>
  <rect x="18" y="24" width="3" height="1" fill="#A0522D"/>

  <!-- Points de couture -->
  <rect x="13" y="20" width="1" height="1" fill="#8B4513"/>
  <rect x="18" y="20" width="1" height="1" fill="#8B4513"/>
  <rect x="15" y="22" width="2" height="1" fill="#8B4513"/>

  <!-- Cœur sur le ventre (optionnel) -->
  <rect x="15" y="22" width="2" height="1" fill="#FFB3C1"/>
</svg>
