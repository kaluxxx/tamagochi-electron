<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Ball - Balle de tennis -->

  <!-- Ombre -->
  <rect x="12" y="24" width="8" height="1" fill="#D0D0D0"/>

  <!-- Contour balle -->
  <rect x="11" y="10" width="10" height="2" fill="#9ACD32"/>
  <rect x="9" y="12" width="14" height="8" fill="#9ACD32"/>
  <rect x="11" y="20" width="10" height="2" fill="#7FA81F"/>

  <!-- Corps de la balle -->
  <rect x="12" y="11" width="8" height="10" fill="#ADFF2F"/>
  <rect x="13" y="12" width="6" height="8" fill="#BFFF3F"/>

  <!-- Highlight (brillance) -->
  <rect x="13" y="12" width="3" height="3" fill="#D4FF8F"/>
  <rect x="14" y="13" width="2" height="2" fill="#E8FFBF"/>
  <rect x="15" y="14" width="1" height="1" fill="#FFFFFF"/>

  <!-- Ombre interne -->
  <rect x="18" y="16" width="1" height="3" fill="#9ACD32"/>
  <rect x="17" y="18" width="2" height="2" fill="#7FA81F"/>

  <!-- Lignes de tennis (courbes) -->
  <rect x="12" y="15" width="1" height="1" fill="#FFFFFF"/>
  <rect x="11" y="16" width="2" height="1" fill="#FFFFFF"/>
  <rect x="10" y="17" width="2" height="1" fill="#FFFFFF"/>

  <rect x="19" y="15" width="1" height="1" fill="#FFFFFF"/>
  <rect x="19" y="16" width="2" height="1" fill="#FFFFFF"/>
  <rect x="20" y="17" width="2" height="1" fill="#FFFFFF"/>

  <!-- Ligne centrale verticale -->
  <rect x="16" y="12" width="1" height="8" fill="#FFFFFF"/>

  <!-- Texture (petits points) -->
  <rect x="14" y="16" width="1" height="1" fill="#9ACD32"/>
  <rect x="17" y="14" width="1" height="1" fill="#9ACD32"/>
  <rect x="15" y="18" width="1" height="1" fill="#9ACD32"/>
</svg>
