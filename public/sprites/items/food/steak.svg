<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Steak - Viande grillée -->

  <!-- Assiette -->
  <rect x="6" y="22" width="20" height="2" fill="#E8E8E8"/>
  <rect x="7" y="24" width="18" height="1" fill="#D0D0D0"/>
  <rect x="8" y="25" width="16" height="1" fill="#B8B8B8"/>

  <!-- Ombre du steak -->
  <rect x="11" y="20" width="10" height="1" fill="#8B4513"/>

  <!-- Contour steak -->
  <rect x="10" y="12" width="12" height="2" fill="#8B2500"/>
  <rect x="9" y="14" width="14" height="6" fill="#8B2500"/>
  <rect x="10" y="20" width="12" height="2" fill="#8B2500"/>

  <!-- Steak principal -->
  <rect x="11" y="13" width="10" height="8" fill="#D2691E"/>
  <rect x="12" y="14" width="8" height="6" fill="#CD5C5C"/>

  <!-- Marques de grill -->
  <rect x="12" y="15" width="8" height="1" fill="#8B2500"/>
  <rect x="11" y="17" width="10" height="1" fill="#8B2500"/>
  <rect x="12" y="19" width="8" height="1" fill="#8B2500"/>

  <!-- Gras/texture -->
  <rect x="13" y="16" width="2" height="1" fill="#F5DEB3"/>
  <rect x="17" y="16" width="2" height="1" fill="#F5DEB3"/>
  <rect x="14" y="18" width="3" height="1" fill="#F5DEB3"/>

  <!-- Highlights (juteux) -->
  <rect x="13" y="14" width="2" height="1" fill="#E9967A"/>
  <rect x="18" y="15" width="1" height="1" fill="#E9967A"/>

  <!-- Os (T-bone) -->
  <rect x="15" y="15" width="2" height="4" fill="#F5F5DC"/>
  <rect x="16" y="16" width="1" height="2" fill="#E8E8E8"/>
  <rect x="14" y="17" width="4" height="1" fill="#F5F5DC"/>
</svg>
