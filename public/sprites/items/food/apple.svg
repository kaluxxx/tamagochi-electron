<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Apple - Pomme rouge -->

  <!-- Tige -->
  <rect x="15" y="8" width="2" height="3" fill="#8B4513"/>
  <rect x="16" y="9" width="1" height="1" fill="#A0522D"/>

  <!-- Feuille -->
  <rect x="17" y="8" width="3" height="2" fill="#2ECC71"/>
  <rect x="18" y="9" width="2" height="1" fill="#52D981"/>
  <rect x="18" y="7" width="2" height="1" fill="#27AE60"/>

  <!-- Contour pomme -->
  <rect x="12" y="11" width="8" height="2" fill="#C0392B"/>
  <rect x="10" y="13" width="12" height="8" fill="#C0392B"/>
  <rect x="12" y="21" width="8" height="2" fill="#A93226"/>

  <!-- Corps de la pomme -->
  <rect x="13" y="12" width="6" height="10" fill="#E74C3C"/>
  <rect x="14" y="13" width="4" height="8" fill="#EC7063"/>

  <!-- Highlight (brillance) -->
  <rect x="14" y="13" width="2" height="3" fill="#F1948A"/>
  <rect x="15" y="14" width="1" height="2" fill="#FADBD8"/>

  <!-- Ombre interne (côté droit) -->
  <rect x="18" y="15" width="1" height="5" fill="#C0392B"/>
  <rect x="17" y="19" width="1" height="2" fill="#A93226"/>

  <!-- Creux du haut -->
  <rect x="15" y="11" width="2" height="1" fill="#8B4513"/>

  <!-- Détails texture -->
  <rect x="13" y="16" width="1" height="1" fill="#EC7063"/>
  <rect x="18" y="17" width="1" height="1" fill="#EC7063"/>
  <rect x="14" y="19" width="1" height="1" fill="#F1948A"/>

  <!-- Creux du bas -->
  <rect x="15" y="22" width="2" height="1" fill="#A93226"/>

  <!-- Ombre au sol -->
  <rect x="13" y="24" width="6" height="1" fill="#D0D0D0"/>
</svg>
