<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Bandage - Pansement en croix -->

  <!-- Ombre -->
  <rect x="10" y="23" width="12" height="1" fill="#D0D0D0"/>

  <!-- Bande horizontale -->
  <!-- Contour -->
  <rect x="8" y="14" width="16" height="2" fill="#E8D5B7"/>
  <rect x="7" y="16" width="18" height="4" fill="#E8D5B7"/>
  <rect x="8" y="20" width="16" height="2" fill="#D2B48C"/>

  <!-- Corps bande horizontale -->
  <rect x="9" y="15" width="14" height="6" fill="#F5E6D3"/>
  <rect x="10" y="16" width="12" height="4" fill="#FEFCF5"/>

  <!-- Texture gaze horizontale -->
  <rect x="10" y="17" width="12" height="1" fill="#E8D5B7"/>
  <rect x="10" y="19" width="12" height="1" fill="#E8D5B7"/>

  <!-- Bande verticale (superposée) -->
  <!-- Contour -->
  <rect x="14" y="8" width="4" height="2" fill="#E8D5B7"/>
  <rect x="13" y="10" width="6" height="14" fill="#E8D5B7"/>
  <rect x="14" y="24" width="4" height="1" fill="#D2B48C"/>

  <!-- Corps bande verticale -->
  <rect x="14" y="9" width="4" height="14" fill="#F5E6D3"/>
  <rect x="15" y="10" width="2" height="12" fill="#FEFCF5"/>

  <!-- Texture gaze verticale -->
  <rect x="15" y="10" width="2" height="1" fill="#E8D5B7"/>
  <rect x="15" y="12" width="2" height="1" fill="#E8D5B7"/>
  <rect x="15" y="14" width="2" height="1" fill="#E8D5B7"/>
  <rect x="15" y="20" width="2" height="1" fill="#E8D5B7"/>
  <rect x="15" y="22" width="2" height="1" fill="#E8D5B7"/>

  <!-- Compresse centrale (carré blanc) -->
  <rect x="14" y="16" width="4" height="4" fill="#FFFFFF"/>
  <rect x="15" y="17" width="2" height="2" fill="#FEFEFE"/>

  <!-- Croix rouge sur la compresse -->
  <rect x="16" y="17" width="1" height="2" fill="#E74C3C"/>
  <rect x="15" y="18" width="3" height="1" fill="#E74C3C"/>
  <rect x="16" y="18" width="1" height="1" fill="#EC7063"/>

  <!-- Points d'adhésif (coins) -->
  <rect x="9" y="16" width="1" height="1" fill="#D2B48C"/>
  <rect x="22" y="16" width="1" height="1" fill="#D2B48C"/>
  <rect x="9" y="19" width="1" height="1" fill="#D2B48C"/>
  <rect x="22" y="19" width="1" height="1" fill="#D2B48C"/>

  <!-- Petites croix supplémentaires (motif) -->
  <rect x="11" y="18" width="1" height="1" fill="#E8D5B7"/>
  <rect x="20" y="18" width="1" height="1" fill="#E8D5B7"/>
</svg>
