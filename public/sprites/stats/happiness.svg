<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Happiness Stat - Smiley joyeux -->

  <!-- Ombre -->
  <rect x="11" y="24" width="10" height="1" fill="#D0D0D0"/>

  <!-- Contour visage -->
  <rect x="11" y="8" width="10" height="2" fill="#F39C12"/>
  <rect x="9" y="10" width="14" height="10" fill="#F39C12"/>
  <rect x="11" y="20" width="10" height="2" fill="#E67E22"/>

  <!-- Visage principal -->
  <rect x="12" y="9" width="8" height="12" fill="#F8C471"/>
  <rect x="13" y="10" width="6" height="10" fill="#FAD7A0"/>

  <!-- Highlight (brillance) -->
  <rect x="13" y="10" width="3" height="3" fill="#FCF3CF"/>
  <rect x="14" y="11" width="2" height="2" fill="#FFFFFF"/>
  <rect x="15" y="12" width="1" height="1" fill="#FFFFFF"/>

  <!-- Yeux joyeux (fermés en souriant) -->
  <rect x="13" y="13" width="2" height="1" fill="#2C3E50"/>
  <rect x="13" y="14" width="3" height="1" fill="#2C3E50"/>
  <rect x="14" y="15" width="2" height="1" fill="#2C3E50"/>

  <rect x="17" y="13" width="2" height="1" fill="#2C3E50"/>
  <rect x="16" y="14" width="3" height="1" fill="#2C3E50"/>
  <rect x="16" y="15" width="2" height="1" fill="#2C3E50"/>

  <!-- Grand sourire -->
  <rect x="14" y="17" width="4" height="1" fill="#2C3E50"/>
  <rect x="13" y="18" width="6" height="1" fill="#2C3E50"/>
  <rect x="13" y="19" width="1" height="1" fill="#2C3E50"/>
  <rect x="18" y="19" width="1" height="1" fill="#2C3E50"/>

  <!-- Joues roses -->
  <rect x="12" y="16" width="2" height="2" fill="#FFB3C1"/>
  <rect x="12" y="17" width="1" height="1" fill="#FF8A8F"/>

  <rect x="18" y="16" width="2" height="2" fill="#FFB3C1"/>
  <rect x="19" y="17" width="1" height="1" fill="#FF8A8F"/>

  <!-- Étoiles de bonheur autour -->
  <rect x="7" y="11" width="1" height="1" fill="#FFD700"/>
  <rect x="6" y="12" width="1" height="1" fill="#FFD700"/>
  <rect x="8" y="12" width="1" height="1" fill="#FFD700"/>
  <rect x="7" y="13" width="1" height="1" fill="#FFD700"/>

  <rect x="24" y="11" width="1" height="1" fill="#FFD700"/>
  <rect x="23" y="12" width="1" height="1" fill="#FFD700"/>
  <rect x="25" y="12" width="1" height="1" fill="#FFD700"/>
  <rect x="24" y="13" width="1" height="1" fill="#FFD700"/>

  <!-- Petites étoiles -->
  <rect x="8" y="9" width="1" height="1" fill="#FFF4A3"/>
  <rect x="23" y="9" width="1" height="1" fill="#FFF4A3"/>
</svg>
