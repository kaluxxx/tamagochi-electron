  <rect x="10" y="12" width="6" height="4" fill="#C0392B"/>

  <!-- Bosses supérieures droite -->
  <rect x="17" y="10" width="4" height="2" fill="#C0392B"/>
  <rect x="16" y="12" width="6" height="4" fill="#C0392B"/>

  <!-- Corps central -->
