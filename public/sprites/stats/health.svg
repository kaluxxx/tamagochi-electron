  <rect x="14" y="22" width="4" height="1" fill="#C0392B"/>
  <rect x="15" y="23" width="2" height="1" fill="#A93226"/>

  <!-- Cœur principal (rouge vif) -->
  <!-- Bosses supérieures -->
