<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Energy Stat - Éclair jaune simple -->

  <!-- Contour éclair -->
  <rect x="15" y="6" width="4" height="2" fill="#F39C12"/>
  <rect x="14" y="8" width="6" height="2" fill="#F39C12"/>
  <rect x="13" y="10" width="7" height="2" fill="#F39C12"/>
  <rect x="15" y="12" width="7" height="2" fill="#F39C12"/>
  <rect x="13" y="14" width="7" height="2" fill="#F39C12"/>
  <rect x="14" y="16" width="6" height="2" fill="#F39C12"/>
  <rect x="16" y="18" width="5" height="2" fill="#F39C12"/>
  <rect x="17" y="20" width="4" height="2" fill="#F39C12"/>
  <rect x="18" y="22" width="2" height="2" fill="#E67E22"/>

  <!-- Corps de l'éclair (jaune vif) -->
  <rect x="16" y="7" width="2" height="15" fill="#FFD700"/>
  <rect x="15" y="9" width="4" height="2" fill="#FFD700"/>
  <rect x="14" y="11" width="5" height="1" fill="#FFD700"/>
  <rect x="16" y="12" width="5" height="2" fill="#FFD700"/>
  <rect x="14" y="14" width="5" height="2" fill="#FFD700"/>
  <rect x="15" y="16" width="4" height="2" fill="#FFD700"/>
  <rect x="17" y="18" width="3" height="2" fill="#FFD700"/>
  <rect x="18" y="20" width="2" height="2" fill="#FFD700"/>

  <!-- Reflet brillant -->
  <rect x="17" y="8" width="1" height="6" fill="#FFF9C4"/>
  <rect x="17" y="9" width="1" height="3" fill="#FFFDE7"/>

  <!-- Ombre pour donner du relief -->
  <rect x="15" y="11" width="1" height="2" fill="#FFA726"/>
  <rect x="14" y="15" width="1" height="1" fill="#FFA726"/>
  <rect x="16" y="19" width="1" height="1" fill="#FFA726"/>

  <!-- Ombre au sol -->
  <rect x="14" y="25" width="6" height="1" fill="#D0D0D0" opacity="0.6"/>
</svg>