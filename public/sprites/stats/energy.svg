<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="shape-rendering: crispEdges;">
  <!-- Energy Stat - Éclair/batterie -->

  <!-- Ombre -->
  <rect x="13" y="25" width="6" height="1" fill="#D0D0D0"/>

  <!-- Contour éclair -->
  <rect x="15" y="6" width="4" height="2" fill="#E67E22"/>
  <rect x="14" y="8" width="6" height="2" fill="#E67E22"/>
  <rect x="13" y="10" width="8" height="2" fill="#E67E22"/>

  <!-- Partie supérieure -->
  <rect x="16" y="7" width="2" height="7" fill="#F39C12"/>
  <rect x="17" y="8" width="1" height="5" fill="#F8C471"/>

  <!-- Zigzag gauche (vers le bas) -->
  <rect x="15" y="11" width="3" height="2" fill="#F39C12"/>
  <rect x="14" y="13" width="4" height="2" fill="#F39C12"/>
  <rect x="13" y="15" width="5" height="2" fill="#F39C12"/>

  <!-- Zigzag droit (vers le bas) -->
  <rect x="18" y="12" width="3" height="2" fill="#F39C12"/>
  <rect x="17" y="14" width="4" height="2" fill="#F39C12"/>
  <rect x="16" y="16" width="5" height="2" fill="#F39C12"/>

  <!-- Partie centrale (plus large) -->
  <rect x="15" y="14" width="4" height="4" fill="#F8C471"/>
  <rect x="16" y="15" width="2" height="2" fill="#FAD7A0"/>

  <!-- Pointe de l'éclair -->
  <rect x="17" y="18" width="3" height="2" fill="#F39C12"/>
  <rect x="16" y="20" width="4" height="2" fill="#F39C12"/>
  <rect x="17" y="22" width="2" height="2" fill="#E67E22"/>
  <rect x="17" y="24" width="1" height="1" fill="#CA6F1E"/>

  <!-- Highlights (brillance) -->
  <rect x="17" y="8" width="1" height="5" fill="#FCF3CF"/>
  <rect x="17" y="9" width="1" height="3" fill="#FFFFFF"/>
  <rect x="16" y="15" width="1" height="2" fill="#FCF3CF"/>

  <!-- Ombre interne -->
  <rect x="18" y="10" width="1" height="6" fill="#E67E22"/>

  <!-- Particules d'énergie autour -->
  <rect x="12" y="9" width="1" height="1" fill="#F8C471"/>
  <rect x="21" y="9" width="1" height="1" fill="#F8C471"/>
  <rect x="11" y="12" width="1" height="1" fill="#FAD7A0"/>
  <rect x="22" y="12" width="1" height="1" fill="#FAD7A0"/>
  <rect x="13" y="7" width="1" height="1" fill="#FFFFFF"/>
  <rect x="20" y="7" width="1" height="1" fill="#FFFFFF"/>

  <!-- Étincelles -->
  <rect x="10" y="14" width="1" height="1" fill="#F39C12"/>
  <rect x="23" y="16" width="1" height="1" fill="#F39C12"/>
</svg>
